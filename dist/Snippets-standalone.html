<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#f8f8f6" />
<title>Snippets</title>
<script>(()=>{const saved=localStorage.getItem('snippets:themeMode')||'system';const dark=saved==='dark'||(saved==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('meta[name="theme-color"]')?.setAttribute('content',dark?'#101010':'#f8f8f6')})()</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&family=Open+Sans:wght@400;600&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>:root {
  --bg: #f8f8f6;
  --surface: #efefec;
  --paper: #fefefd;
  --paper-edge: #e7e7e2;
  --surface-strong: #e8e8e4;
  --text: #171717;
  --muted: #777773;
  --faint: #aaa9a4;
  --hairline: #deded9;
  --overlay: rgba(0, 0, 0, .18);
  --highlight: #e7dfb6;
  --danger: #8e3b36;
  --shadow: 0 10px 30px rgba(0, 0, 0, .08), 0 1px 4px rgba(0, 0, 0, .06);
  --paper-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 16px 44px rgba(0, 0, 0, .035);
  --editor-max: 920px;
  --editor-text-max: 720px;
  --library-max: 860px;
  --radius: 13px;
  --pill: 999px;
  --ui-font: "iA Writer Duo", "iA Writer Duospace", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --editor-font: "iA Writer Duo", "iA Writer Duospace", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --editor-size: 18px;
}

html[data-theme="dark"] {
  --bg: #101010;
  --surface: #1c1c1b;
  --paper: #171716;
  --paper-edge: #262624;
  --surface-strong: #252524;
  --text: #ededeb;
  --muted: #949491;
  --faint: #666663;
  --hairline: #2d2d2b;
  --overlay: rgba(0, 0, 0, .48);
  --highlight: #5a5335;
  --danger: #d27870;
  --shadow: 0 12px 34px rgba(0, 0, 0, .35), 0 1px 5px rgba(0, 0, 0, .28);
  --paper-shadow: 0 1px 1px rgba(255, 255, 255, .015), 0 18px 48px rgba(0, 0, 0, .24);
}

* { box-sizing: border-box; }
html, body, #app { min-height: 100%; margin: 0; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--ui-font);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background-color 120ms ease, color 120ms ease;
}
button, input, select { font: inherit; }
button { color: inherit; }
button, [role="button"] { -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 1.5px solid var(--muted);
  outline-offset: 2px;
}

.editor-screen, .library-screen, .trash-screen {
  min-height: 100dvh;
  background: var(--bg);
}

.editor-screen {
  position: relative;
  background: var(--bg);
}
.editor-wrap {
  width: min(calc(100% - 48px), var(--editor-max));
  margin: 0 auto;
  padding: 22px 0 124px;
}
.editor-sheet {
  width: 100%;
  min-height: calc(100dvh - 146px);
  padding: clamp(54px, 7vw, 84px) clamp(42px, 7vw, 88px) 132px;
  border: 1px solid var(--paper-edge);
  border-radius: 3px;
  background: var(--paper);
  box-shadow: var(--paper-shadow);
  transition: background-color 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
}
.editor-status {
  position: fixed;
  top: calc(14px + env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  min-height: 18px;
  color: var(--faint);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  pointer-events: none;
}
.editor-status:empty { display: none; }
.editor-tags {
  position: fixed;
  left: 50%;
  bottom: calc(80px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  width: min(calc(100% - 32px), var(--editor-text-max));
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  pointer-events: none;
  z-index: 3;
}
.tag-chip {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 3px 8px;
  border: 1px solid var(--hairline);
  border-radius: var(--pill);
  background: color-mix(in srgb, var(--surface) 80%, transparent);
  color: var(--muted);
  font-size: 11px;
  line-height: 1;
  white-space: nowrap;
}


.editor-meta-strip {
  position: sticky;
  top: 0;
  z-index: 20;
  width: 100%;
  min-height: 42px;
  display: inline-grid;
  grid-template-columns: 28px 28px max-content 28px;
  align-items: center;
  column-gap: 6px;
  justify-content: start;
  margin-bottom: 16px;
  padding: 0 4px;
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  color: var(--muted);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.editor-meta-control {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  flex: 0 0 28px;
  padding: 0;
  border: 0;
  border-radius: var(--pill);
  background: transparent;
  color: var(--muted);
  line-height: 1;
  cursor: pointer;
}
.editor-meta-icon {
  width: 18px;
  height: 18px;
  display: block;
  overflow: visible;
}
.editor-meta-star-icon polygon {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.45;
  stroke-linejoin: round;
}
.editor-meta-star.is-active .editor-meta-star-icon polygon {
  fill: currentColor;
  stroke: currentColor;
}
.editor-meta-plus-icon path {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
}
.editor-meta-todo-icon path {
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.editor-meta-control:hover {
  background: var(--surface-strong);
  color: var(--text);
}
.editor-meta-star.is-active {
  background: transparent;
  color: var(--text);
}
.editor-meta-tag-area {
  min-width: 0;
  min-height: 28px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  line-height: 1;
  cursor: pointer;
}
.editor-meta-tag-list {
  min-width: 0;
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
}
.editor-meta-strip .tag-chip {
  height: 28px;
  min-height: 28px;
  display: inline-flex;
  align-items: center;
  padding: 0 10px;
  font-size: 11px;
}
.editor-meta-empty-tag {
  height: 28px;
  display: inline-flex;
  align-items: center;
  padding: 0 10px;
  border: 1px solid color-mix(in srgb, var(--hairline) 72%, transparent);
  border-radius: var(--pill);
  background: color-mix(in srgb, var(--surface) 46%, transparent);
  color: var(--faint);
  font-size: 11px;
  line-height: 1;
  white-space: nowrap;
}
.editor-meta-tag-area:hover .tag-chip,
.editor-meta-tag-area:hover .editor-meta-empty-tag {
  border-color: var(--muted);
  color: var(--text);
}
.editor-meta-add { color: var(--faint); }

.markdown-editor {
  position: relative;
  width: min(100%, var(--editor-text-max));
  min-height: calc(100dvh - 370px);
  margin: 0 auto;
  font-family: var(--editor-font);
  font-size: var(--editor-size);
  line-height: 1.66;
}
.editor-text-surface {
  position: relative;
  z-index: 1;
  width: 100%;
  min-height: inherit;
  outline: none;
}
.editor-line-text {
  position: relative;
  min-width: 0;
  min-height: 1.66em;
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  outline: none;
  transition: opacity 100ms ease, transform 100ms ease;
}
.editor-line-text.editor-line--todo { padding-left: 60px; }
.editor-line-text.editor-line--bullet { padding-left: 24px; }
.editor-line-text.editor-line--bullet.is-editing { padding-left: 0; }
.editor-line-text.editor-line--quote {
  border-left: 2px solid var(--hairline);
  padding-left: 14px;
  color: var(--muted);
}
.editor-line-text.is-drop-target::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 1px;
  background: var(--muted);
}
.editor-line-text strong { font-weight: 650; }
.editor-line-text em { font-style: italic; }
.editor-line-text code {
  padding: .08em .3em;
  border-radius: 4px;
  background: var(--surface);
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: .9em;
}
.editor-line-text mark {
  padding: 0 .06em;
  border-radius: 3px;
  background: var(--highlight);
  color: inherit;
}
.editor-line-text a { color: inherit; text-decoration-color: var(--faint); text-underline-offset: 3px; pointer-events: auto; cursor: pointer; }
.editor-line-text.is-complete { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.editor-line-text.heading-1 { font-size: 1.42em; line-height: 1.4; font-weight: 650; margin: .24em 0 .1em; }
.editor-line-text.heading-2 { font-size: 1.22em; line-height: 1.45; font-weight: 650; margin: .18em 0 .08em; }
.editor-line-text.heading-3 { font-size: 1.08em; line-height: 1.5; font-weight: 650; }
.editor-line-text.heading-4 { font-size: 1.02em; line-height: 1.54; font-weight: 650; }
.editor-line-text.is-editing { color: var(--text); }
.editor-control-gutter {
  position: absolute;
  z-index: 2;
  top: 0;
  left: 0;
  width: 60px;
  height: 100%;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
}
.editor-gutter-item {
  position: absolute;
  left: 0;
  width: 60px;
  min-height: 1.66em;
  display: flex;
  align-items: flex-start;
  pointer-events: none;
}
.editor-gutter-item--todo { gap: 5px; }
.editor-gutter-item--bullet { width: 24px; justify-content: center; }
.editor-gutter-item.is-dragging { opacity: .48; }
.bullet-marker {
  width: 20px;
  min-height: 1.66em;
  color: var(--faint);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  text-align: center;
  user-select: none;
}
.bullet-marker::before { content: "•"; }
.editor-gutter-item--bullet.is-editing .bullet-marker { visibility: hidden; }
.todo-check-slot {
  width: 25px;
  height: 1.66em;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.todo-check {
  appearance: none;
  width: 17px;
  height: 17px;
  margin: 0;
  border: 1.25px solid var(--muted);
  border-radius: 4px;
  background: transparent;
  display: grid;
  place-content: center;
  cursor: pointer;
  pointer-events: auto;
}
.todo-check:checked::after {
  content: "";
  width: 7px;
  height: 4px;
  border-left: 1.5px solid var(--text);
  border-bottom: 1.5px solid var(--text);
  transform: rotate(-45deg) translateY(-1px);
}
.todo-handle {
  width: 25px;
  height: 1.66em;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--faint);
  display: grid;
  place-items: center;
  opacity: .34;
  cursor: grab;
  touch-action: none;
  pointer-events: auto;
}
.todo-handle-icon { width: 17px; height: 17px; display: block; }
.editor-gutter-item--todo:hover .todo-handle, .todo-handle:focus-visible { opacity: .85; }

.control-strip[hidden] { display: none !important; }

.control-strip {
  position: fixed;
  left: 50%;
  bottom: calc(14px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1px;
  padding: 5px;
  border: 1px solid color-mix(in srgb, var(--hairline) 86%, transparent);
  border-radius: var(--pill);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  box-shadow: var(--shadow);
  backdrop-filter: blur(20px) saturate(120%);
  -webkit-backdrop-filter: blur(20px) saturate(120%);
}
.control-button {
  display: grid;
  place-items: center;
  min-width: 48px;
  height: 44px;
  padding: 0 10px;
  border: 0;
  border-radius: var(--pill);
  background: transparent;
  color: var(--muted);
  font-size: 15px;
  cursor: pointer;
  transition: background 100ms ease, color 100ms ease, transform 100ms ease;
}
.control-button:hover { background: var(--surface-strong); color: var(--text); }
.control-button.is-danger { color: var(--danger); }
.batch-control-strip { min-width: 0; }
.toolbar-action-icon { width: 20px; height: 20px; display: block; }
.batch-count {
  min-width: 34px;
  padding: 0 7px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.selection-indicator {
  grid-area: select;
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  align-self: center;
  border: 1.25px solid var(--muted);
  border-radius: 50%;
  color: var(--bg);
  background: transparent;
  font-size: 13px;
  line-height: 1;
}
.is-selected > .selection-indicator,
.desktop-sidebar-row.is-selected .selection-indicator,
.trash-row.is-selected .selection-indicator {
  border-color: var(--text);
  background: var(--text);
}
.control-button:active { transform: scale(.96); }
.control-button.is-active { background: var(--surface-strong); color: var(--text); }
.control-button[disabled] { opacity: .28; cursor: default; }
.control-button.control-aa { font-size: 13px; letter-spacing: -.05em; }
.control-button.control-more { padding-left: 10px; }

.library-inner, .trash-inner {
  width: min(calc(100% - 48px), var(--library-max));
  margin: 0 auto;
  padding: calc(26px + env(safe-area-inset-top)) 0 118px;
}
.library-header {
  position: sticky;
  top: 0;
  z-index: 5;
  padding: 9px 0 13px;
  background: linear-gradient(var(--bg) 72%, color-mix(in srgb, var(--bg) 0%, transparent));
}
.segmented {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  width: min(100%, 420px);
  margin: 0 auto;
  padding: 3px;
  border: 1px solid var(--hairline);
  border-radius: var(--pill);
  background: var(--surface);
}
.segmented button {
  min-height: 34px;
  padding: 0 14px;
  border: 0;
  border-radius: var(--pill);
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  cursor: pointer;
}
.segmented button[aria-selected="true"], .segmented button.is-active {
  background: var(--bg);
  color: var(--text);
  box-shadow: 0 1px 2px rgba(0,0,0,.05);
}
.tag-filter-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 12px;
}
.tag-filter-title { font-size: 13px; color: var(--text); }
.quiet-button {
  min-width: 36px;
  min-height: 36px;
  border: 0;
  border-radius: var(--pill);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.quiet-button:hover { background: var(--surface); color: var(--text); }
.search-wrap { margin: 12px auto 0; width: min(100%, 620px); }
.search-input, .sheet-search {
  width: 100%;
  height: 42px;
  border: 1px solid var(--hairline);
  border-radius: var(--pill);
  background: var(--surface);
  color: var(--text);
  padding: 0 16px;
  outline: none;
  font-size: 13px;
}
.search-input::placeholder, .sheet-search::placeholder { color: var(--faint); }
.library-list { border-top: 1px solid var(--hairline); }
.library-row {
  width: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "title time" "preview time" "tags time";
  column-gap: 20px;
  row-gap: 5px;
  padding: 17px 2px 16px;
  border: 0;
  border-bottom: 1px solid var(--hairline);
  background: transparent;
  color: var(--text);
  text-align: left;
  cursor: pointer;
}
.library-row:hover { background: color-mix(in srgb, var(--surface) 40%, transparent); }
.library-row.is-selection-mode {
  grid-template-columns: 30px minmax(0, 1fr) auto;
  grid-template-areas: "select title time" "select preview time" "select tags time";
  column-gap: 12px;
}
.library-row.is-selected { background: color-mix(in srgb, var(--surface-strong) 62%, transparent); }
.library-title {
  grid-area: title;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -.015em;
}
.library-preview {
  grid-area: preview;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.5;
}
.library-tags { grid-area: tags; display: flex; flex-wrap: wrap; gap: 5px; min-height: 0; }
.library-tags:empty { display: none; }
.library-modified {
  grid-area: time;
  align-self: center;
  color: var(--faint);
  font-size: 10px;
  white-space: nowrap;
  text-align: right;
}
.library-empty {
  padding: 70px 0;
  color: var(--faint);
  font-size: 12px;
  text-align: center;
}

.sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: end center;
  padding: 18px;
  background: var(--overlay);
  opacity: 0;
  animation: backdrop-in 120ms ease forwards;
}
.sheet-backdrop.sheet-backdrop-no-fade {
  opacity: 1;
  animation: none;
}

.sheet {
  width: min(100%, 430px);
  max-height: min(72dvh, 620px);
  overflow: auto;
  padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
  border: 1px solid var(--hairline);
  border-radius: 18px;
  background: var(--bg);
  box-shadow: var(--shadow);
  transform: translateY(10px);
  animation: sheet-in 140ms ease forwards;
}
.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 42px;
  padding: 2px 6px 8px 10px;
}
.sheet-title { font-size: 12px; font-weight: 600; }
.sheet-body { padding: 4px; }
.sheet-section-label {
  margin: 16px 8px 7px;
  color: var(--faint);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .11em;
  text-transform: uppercase;
}
.sheet-row, .menu-row {
  width: 100%;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 11px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--text);
  font-size: 12px;
  text-align: left;
  cursor: pointer;
}
.sheet-row:hover, .menu-row:hover { background: var(--surface); }
.menu-row.is-danger { color: var(--danger); }
.sheet-row input[type="checkbox"], .sheet-row input[type="radio"] { accent-color: var(--text); }
.sheet-count { color: var(--faint); font-size: 10px; }
.sheet-search { margin: 2px 0 7px; }
.create-tag { color: var(--muted); }
.font-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 4px; }
.font-choice {
  min-height: 50px;
  padding: 8px 10px;
  border: 1px solid var(--hairline);
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.font-choice.is-active { background: var(--surface); color: var(--text); border-color: var(--muted); }
.size-row { display: grid; grid-template-columns: 40px 1fr 40px; gap: 8px; align-items: center; padding: 5px; }
.size-row button { height: 38px; border: 1px solid var(--hairline); border-radius: var(--pill); background: var(--surface); color: var(--text); }
.size-value { text-align: center; font-size: 12px; color: var(--muted); }
.settings-select { width: 100%; height: 42px; border: 1px solid var(--hairline); border-radius: 10px; padding: 0 10px; background: var(--surface); color: var(--text); }
.app-version { padding: 18px 8px 4px; color: var(--faint); font-size: 10px; text-align: center; }

.trash-header { display: flex; align-items: center; gap: 8px; padding: 4px 0 18px; }
.trash-header-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.trash-select-button, .trash-delete-all-button { width: auto; padding: 0 10px; font-size: 11px; }
.trash-delete-all-button { color: var(--danger); }
.trash-title { font-size: 15px; font-weight: 600; }
.trash-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  padding: 16px 0;
  border-bottom: 1px solid var(--hairline);
}
.trash-row.is-selection-mode { grid-template-columns: 30px minmax(0, 1fr); align-items: center; cursor: pointer; }

// ---- src/domain/snippetText.js ----
function meaningfulLines(content = '') {
  return String(content).split(/\r?\n/).map(line => line.trim()).filter(Boolean);
}

function cleanLine(line = '') {
  return line
    .replace(/^#{1,6}\s+/, '')
    .replace(/^\s*[-*+]\s+\[[ xX]\]\s+/, '')
    .replace(/^\s*[-*+]\s+/, '')
    .replace(/^\s*>\s?/, '')
    .replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1 ($2)')
    .replace(/==(.+?)==/g, '$1')
    .replace(/\*\*(.+?)\*\*/g, '$1')
    .replace(/__(.+?)__/g, '$1')
    .replace(/\*(.+?)\*/g, '$1')
    .replace(/_(.+?)_/g, '$1')
    .replace(/~~(.+?)~~/g, '$1')
    .replace(/`(.+?)`/g, '$1')
    .trim();
}

function getSnippetTitle(content) {
  return cleanLine(meaningfulLines(content)[0] || '');
}

function getSnippetPreview(content) {
  return cleanLine(meaningfulLines(content)[1] || '');
}

function toPlainText(content) {
  return String(content).split(/\r?\n/).map(cleanLine).join('\n').trim();
}


// ---- src/domain/sharePayload.js ----
function buildSharePayload(content = '', sourceUrl = null) {
  const lines = String(content ?? '').replace(/\r/g, '').split('\n');
  const titleIndex = lines.findIndex(line => line.trim().length > 0);
  if (titleIndex < 0) return {};

  const title = getSnippetTitle(lines[titleIndex]);
  const body = toPlainText(lines.slice(titleIndex + 1).join('\n'));
  const url = String(sourceUrl ?? '').trim();
  const payload = {};
  if (title) payload.title = title;
  if (body) payload.text = body;
  if (url) payload.url = url;
  return payload;
}


// ---- src/domain/launchPolicy.js ----
const RETURN_WINDOWS = Object.freeze({
  fresh: 0,
  '30s': 30_000,
  '60s': 60_000,
  '5m': 5 * 60_000,
  '15m': 15 * 60_000,
  always: Number.POSITIVE_INFINITY
});

function chooseLaunchTarget({ snippets = [], now = Date.now(), returnWindow = '60s', captureFirst = false } = {}) {
  const live = snippets.filter(snippet => snippet && snippet.deletedAt == null);
  const pinned = live.find(snippet => snippet.pinned);
  if (pinned) return { type: 'snippet', id: pinned.id };
  if (captureFirst) return { type: 'blank' };

  const latest = [...live].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0];
  if (!latest) return { type: 'blank' };

  const windowMs = RETURN_WINDOWS[returnWindow] ?? RETURN_WINDOWS['60s'];
  if (windowMs === 0) return { type: 'inbox' };
  return now - latest.updatedAt <= windowMs
    ? { type: 'snippet', id: latest.id }
    : { type: 'inbox' };
}


// ---- src/domain/trashPolicy.js ----
const TRASH_RETENTION_MS = 30 * 24 * 60 * 60 * 1000;

function isTrashExpired(deletedAt, now = Date.now()) {
  return deletedAt != null && now - deletedAt >= TRASH_RETENTION_MS;
}


// ---- src/domain/libraryItem.js ----
function formatModified(timestamp, now = new Date(), locale = undefined, timeZone = undefined) {
  const date = new Date(timestamp);
  const sameDay = date.getFullYear() === now.getFullYear() && date.getMonth() === now.getMonth() && date.getDate() === now.getDate();
  const options = sameDay
    ? { hour: 'numeric', minute: '2-digit' }
    : { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' };
  if (timeZone) options.timeZone = timeZone;
  return new Intl.DateTimeFormat(locale, options).format(date);
}

function makeLibraryItem(snippet, options = {}) {
  return {
    id: snippet.id,
    title: getSnippetTitle(snippet.content),
    preview: getSnippetPreview(snippet.content),
    tags: [...(snippet.tags || [])],
    modified: formatModified(snippet.updatedAt, options.now, options.locale, options.timeZone),
    updatedAt: snippet.updatedAt,
    starred: Boolean(snippet.starred),
    archived: Boolean(snippet.archived),
    pinned: Boolean(snippet.pinned)
  };
}


// ---- src/domain/keyboardShortcuts.js ----
const DEFAULT_SHORTCUTS = Object.freeze({
  newSnippet: 'Mod+N',
  inbox: 'Mod+1',
  starred: 'Mod+2',
  archive: 'Mod+3',
  toggleStar: 'Mod+Shift+S',
  tags: 'Mod+Shift+T',
  toggleSidebar: 'Mod+Backslash'
});

const RESERVED = new Set(['Mod+L', 'Mod+T', 'Mod+W', 'Mod+R', 'Mod+Q']);

function normalizedKey(key = '') {
  if (key === '\\') return 'Backslash';
  if (key === ' ') return 'Space';
  if (key.length === 1) return key.toUpperCase();
  if (key === 'Esc') return 'Escape';
  return key;
}

function shortcutParts(event) {
  const usesMod = Boolean(event.metaKey || event.ctrlKey);
  if (!usesMod) return null;
  const key = normalizedKey(event.key);
  if (!key || ['Meta', 'Control', 'Shift', 'Alt'].includes(key)) return null;
  const parts = ['Mod'];
  if (event.altKey) parts.push('Alt');
  if (event.shiftKey) parts.push('Shift');
  parts.push(key);
  return parts;
}

function shortcutFromEvent(event) {
  const parts = shortcutParts(event);
  return parts ? parts.join('+') : null;
}

function shortcutMatchesEvent(shortcut, event) {
  if (!shortcut) return false;
  return shortcutFromEvent(event) === shortcut;
}

function findShortcutConflict(shortcuts, action, candidate) {
  for (const [otherAction, shortcut] of Object.entries(shortcuts || {})) {
    if (otherAction !== action && shortcut === candidate) return otherAction;
  }
  return null;
}

function isLikelyReservedShortcut(shortcut) {
  return RESERVED.has(shortcut);
}

function formatShortcut(shortcut, { isMac = false } = {}) {
  if (!shortcut) return 'Not set';
  const parts = shortcut.split('+');
  if (!isMac) {
    return parts.map(part => part === 'Mod' ? 'Ctrl' : part === 'Backslash' ? '\\' : part).join('+');
  }
  const glyphs = { Mod: '⌘', Shift: '⇧', Alt: '⌥', Backslash: '\\', Space: 'Space' };
  return parts.map(part => glyphs[part] ?? part).join('');
}

}

// ---- src/storage/db.js ----
const DB_NAME = 'snippets';
const DB_VERSION = 1;

const memoryStores = {
  snippets: new Map(),
  tags: new Map(),
  preferences: new Map(),
  syncQueue: new Map()
};

function hasIndexedDb() {
  return typeof globalThis.indexedDB !== 'undefined';
}

function memoryKey(storeName, value) {
  if (storeName === 'snippets') return value.id;
  if (storeName === 'tags') return value.name;
  if (storeName === 'preferences') return value.key;
  if (storeName === 'syncQueue') return value.id;
  throw new Error(`Unknown store: ${storeName}`);
}

function clone(value) {
  if (value === undefined) return undefined;
  return globalThis.structuredClone ? structuredClone(value) : JSON.parse(JSON.stringify(value));
}

function requestPromise(request) {
  return new Promise((resolve, reject) => {
    request.addEventListener('success', () => resolve(request.result), { once: true });
    request.addEventListener('error', () => reject(request.error), { once: true });
  });
}

function transactionPromise(transaction) {
  return new Promise((resolve, reject) => {
    transaction.addEventListener('complete', () => resolve(), { once: true });
    transaction.addEventListener('abort', () => reject(transaction.error || new Error('IndexedDB transaction aborted')), { once: true });
    transaction.addEventListener('error', () => reject(transaction.error || new Error('IndexedDB transaction failed')), { once: true });
  });
}

function openSnippetsDb() {
  if (!hasIndexedDb()) throw new Error('IndexedDB is unavailable in this environment');
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.addEventListener('upgradeneeded', () => {
      const db = request.result;
      if (!db.objectStoreNames.contains('snippets')) db.createObjectStore('snippets', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('tags')) db.createObjectStore('tags', { keyPath: 'name' });
      if (!db.objectStoreNames.contains('preferences')) db.createObjectStore('preferences', { keyPath: 'key' });
      if (!db.objectStoreNames.contains('syncQueue')) db.createObjectStore('syncQueue', { keyPath: 'id' });
    });
    request.addEventListener('success', () => resolve(request.result), { once: true });
    request.addEventListener('error', () => reject(request.error), { once: true });
  });
}

async function dbGet(storeName, key) {
  if (!hasIndexedDb()) return clone(memoryStores[storeName].get(key));
  const db = await openSnippetsDb();
  try {
    const tx = db.transaction(storeName, 'readonly');
    return await requestPromise(tx.objectStore(storeName).get(key));
  } finally { db.close(); }
}

async function dbGetAll(storeName) {
  if (!hasIndexedDb()) return [...memoryStores[storeName].values()].map(clone);
  const db = await openSnippetsDb();
  try {
    const tx = db.transaction(storeName, 'readonly');
    return await requestPromise(tx.objectStore(storeName).getAll());
  } finally { db.close(); }
}

async function dbPut(storeName, value) {
  if (!hasIndexedDb()) {
    memoryStores[storeName].set(memoryKey(storeName, value), clone(value));
    return clone(value);
  }
  const db = await openSnippetsDb();
  try {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).put(value);
    await transactionPromise(tx);
    return value;
  } finally { db.close(); }
}

async function dbDelete(storeName, key) {
  if (!hasIndexedDb()) { memoryStores[storeName].delete(key); return; }
  const db = await openSnippetsDb();
  try {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).delete(key);
    await transactionPromise(tx);
  } finally { db.close(); }
}


async function dbClear(storeName) {
  if (!hasIndexedDb()) { memoryStores[storeName].clear(); return; }
  const db = await openSnippetsDb();
  try {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).clear();
    await transactionPromise(tx);
  } finally { db.close(); }
}

async function withReadWriteStore(storeName, callback) {
  if (!hasIndexedDb()) {
    const map = memoryStores[storeName];
    const store = {
      getAll: () => [...map.values()].map(clone),
      get: key => clone(map.get(key)),
      put: value => { map.set(memoryKey(storeName, value), clone(value)); return value; },
      delete: key => map.delete(key)
    };
    return callback(store, value => Promise.resolve(value));
  }
  const db = await openSnippetsDb();
  try {
    const tx = db.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    const result = await callback(store, requestPromise);
    await transactionPromise(tx);
    return result;
  } finally { db.close(); }
}

function deleteSnippetsDb() {
  if (!hasIndexedDb()) {
    for (const store of Object.values(memoryStores)) store.clear();
    return Promise.resolve();
  }
  return new Promise((resolve, reject) => {
    const request = indexedDB.deleteDatabase(DB_NAME);
    request.addEventListener('success', () => resolve(), { once: true });
    request.addEventListener('blocked', () => reject(new Error('IndexedDB deletion blocked')), { once: true });
    request.addEventListener('error', () => reject(request.error), { once: true });
  });
}


// ---- src/cloud/syncQueue.js ----
async function enqueueSyncOperation(operation) {
  if (!operation?.id || !operation?.type) throw new Error('Sync operation requires id and type');
  const next = {
    id: String(operation.id),
    type: String(operation.type),
    payload: operation.payload ?? null,
    queuedAt: Date.now()
  };
  await dbPut('syncQueue', next);
  return next;
}

async function listSyncOperations() {
  const rows = await dbGetAll('syncQueue');
  return rows.sort((a, b) => a.queuedAt - b.queuedAt);
}

function removeSyncOperation(id) {
  return dbDelete('syncQueue', id);
}


// ---- src/storage/snippetRepository.js ----
function makeSnippet(content, now, options = {}) {
  return {
    id: crypto.randomUUID(),
    content: String(content),
    createdAt: now,
    updatedAt: now,
    starred: false,
    archived: false,
    deletedAt: null,
    pinned: false,
    tags: Array.isArray(options.tags) ? [...options.tags] : [],
    sourceUrl: options.sourceUrl || null
  };
}

async function createSnippet(content, now = Date.now(), options = {}) {
  const snippet = makeSnippet(content, now, options);
  await dbPut('snippets', snippet);
  await enqueueSyncOperation({ id: `item:${snippet.id}`, type: 'upsert-item', payload: snippet });
  return snippet;
}

function getSnippet(id) { return dbGet('snippets', id); }

async function updateSnippet(id, patch, now = Date.now()) {
  const current = await getSnippet(id);
  if (!current) throw new Error(`Snippet not found: ${id}`);
  const next = { ...current, ...patch, id: current.id, createdAt: current.createdAt, updatedAt: now };
  await dbPut('snippets', next);
  await enqueueSyncOperation({ id: `item:${next.id}`, type: 'upsert-item', payload: next });
  return next;
}

async function removeSnippetIfEmpty(id) {
  const current = await getSnippet(id);
  if (!current || current.content.trim()) return false;
  await dbDelete('snippets', id);
  await enqueueSyncOperation({ id: `item:${id}`, type: 'delete-item', payload: { id } });
  return true;
}

async function listSnippets({ scope = 'inbox', tag = null, query = '' } = {}) {
  const all = await dbGetAll('snippets');
  const q = String(query).trim().toLowerCase();
  return all.filter(item => {
    if (scope === 'trash') return item.deletedAt != null;
    if (item.deletedAt != null) return false;
    if (scope === 'inbox' && item.archived) return false;
    if (scope === 'starred' && !item.starred) return false;
    if (scope === 'archive' && !item.archived) return false;
    if (!['inbox', 'starred', 'archive', 'all'].includes(scope)) return false;
    if (tag && !item.tags.includes(tag)) return false;
    if (q && !`${item.content}\n${item.tags.join(' ')}`.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => Number(b.starred) - Number(a.starred) || b.updatedAt - a.updatedAt);
}

async function setPinnedSnippet(id = null) {
  const changed = [];
  await withReadWriteStore('snippets', async (store, toPromise) => {
    const all = await toPromise(store.getAll());
    for (const item of all) {
      const nextPinned = item.id === id && item.deletedAt == null;
      if (item.pinned !== nextPinned) {
        const next = { ...item, pinned: nextPinned, updatedAt: Date.now() };
        store.put(next);
        changed.push(next);
      }
    }
  });
  for (const item of changed) {
    await enqueueSyncOperation({ id: `item:${item.id}`, type: 'upsert-item', payload: item });
  }
}

async function moveToTrash(id, now = Date.now()) {
  const current = await getSnippet(id);
  if (!current) return;
  const next = { ...current, deletedAt: now, pinned: false, updatedAt: now };
  await dbPut('snippets', next);
  await enqueueSyncOperation({ id: `item:${id}`, type: 'upsert-item', payload: next });
}

async function restoreSnippet(id) {
  const current = await getSnippet(id);
  if (!current) return;
  const next = { ...current, deletedAt: null, updatedAt: Date.now() };
  await dbPut('snippets', next);
  await enqueueSyncOperation({ id: `item:${id}`, type: 'upsert-item', payload: next });
}

async function deleteSnippetPermanently(id) {
  await dbDelete('snippets', id);
  await enqueueSyncOperation({ id: `item:${id}`, type: 'delete-item', payload: { id } });
}

async function purgeExpiredTrash(now = Date.now()) {
  const all = await dbGetAll('snippets');
  const expired = all.filter(item => isTrashExpired(item.deletedAt, now));
  for (const item of expired) {
    await dbDelete('snippets', item.id);
    await enqueueSyncOperation({ id: `item:${item.id}`, type: 'delete-item', payload: { id: item.id } });
  }
  return expired.length;
}


// ---- src/storage/tagRepository.js ----
function normalizeTag(rawName = '') {
  return String(rawName).trim().replace(/^#/, '').replace(/[<>&\"']/g, '').replace(/\s+/g, '-').toLowerCase();
}

async function ensureTag(rawName) {
  const name = normalizeTag(rawName);
  if (!name) throw new Error('Tag name cannot be empty');
  const tag = { name, createdAt: Date.now() };
  await dbPut('tags', tag);
  await enqueueSyncOperation({ id: `tag:${name}`, type: 'upsert-tag', payload: tag });
  return name;
}

async function toggleSnippetTag(snippetId, rawName) {
  const name = await ensureTag(rawName);
  const snippet = await getSnippet(snippetId);
  if (!snippet) throw new Error(`Snippet not found: ${snippetId}`);
  const hasTag = snippet.tags.includes(name);
  const tags = hasTag ? snippet.tags.filter(tag => tag !== name) : [...snippet.tags, name].sort();
  return updateSnippet(snippetId, { tags });
}


async function setSnippetTag(snippetId, rawName, enabled) {
  const name = await ensureTag(rawName);
  const snippet = await getSnippet(snippetId);
  if (!snippet) throw new Error(`Snippet not found: ${snippetId}`);
  const hasTag = snippet.tags.includes(name);
  if (hasTag === Boolean(enabled)) return snippet;
  const tags = enabled ? [...snippet.tags, name].sort() : snippet.tags.filter(tag => tag !== name);
  return updateSnippet(snippetId, { tags });
}

async function listTagsWithCounts() {
  const [tags, snippets] = await Promise.all([dbGetAll('tags'), dbGetAll('snippets')]);
  return tags.map(({ name }) => ({
    name,
    count: snippets.filter(snippet => snippet.deletedAt == null && snippet.tags.includes(name)).length
  })).sort((a, b) => a.name.localeCompare(b.name));
}

// ---- src/cloud/cacheOwner.js ----
const OWNER_KEY = 'snippets:ownerId';

async function hasLocalData() {
  const [snippets, tags, preferences, queue] = await Promise.all([
    dbGetAll('snippets'), dbGetAll('tags'), dbGetAll('preferences'), dbGetAll('syncQueue')
  ]);
  return snippets.length + tags.length + preferences.length + queue.length > 0;
}

async function prepareCacheForUser(userId) {
  const owner = localStorage.getItem(OWNER_KEY);
  if (!owner) {
    const adoptedExistingCache = await hasLocalData();
    localStorage.setItem(OWNER_KEY, userId);
    return { adoptedExistingCache, clearedForDifferentUser: false };
  }
  if (owner === userId) return { adoptedExistingCache: false, clearedForDifferentUser: false };

  await deleteSnippetsDb();
  localStorage.removeItem?.('snippets:themeMode');
  localStorage.setItem(OWNER_KEY, userId);
  return { adoptedExistingCache: false, clearedForDifferentUser: true };
}


// ---- src/cloud/cloudSync.js ----
function throwIfError(result) {
  if (result?.error) throw result.error;
  return result;
}

async function executeOperation(client, userId, operation) {
  if (operation.type === 'upsert-item') {
    return throwIfError(await client.from('snippets_items').upsert(snippetToRow(operation.payload, userId)));
  }
  if (operation.type === 'delete-item') {
    return throwIfError(await client.from('snippets_items').delete().eq('id', operation.payload.id).eq('user_id', userId));
  }
  if (operation.type === 'upsert-tag') {
    const row = { user_id: userId, name: operation.payload.name };
    if (operation.payload.createdAt) row.created_at = new Date(operation.payload.createdAt).toISOString();
    return throwIfError(await client.from('snippets_tags').upsert(row, { onConflict: 'user_id,name' }));
  }
  if (operation.type === 'upsert-preferences') {
    return throwIfError(await client.from('snippets_preferences').upsert(preferencesToRow(operation.payload, userId)));
  }
  throw new Error(`Unknown sync operation: ${operation.type}`);
}

async function flushCloudQueue(client, userId) {
  const operations = await listSyncOperations();
  let completed = 0;
  let failed = 0;
  const errors = [];
  for (const operation of operations) {
    try {
      await executeOperation(client, userId, operation);
      await removeSyncOperation(operation.id);
      completed += 1;
    } catch (error) {
      failed += 1;
      errors.push({ operationId: operation.id, error });
    }
  }
  return { completed, failed, errors };
}

async function fetchOwnRows(client, table, userId) {
  const result = await client.from(table).select('*').eq('user_id', userId);
  throwIfError(result);
  return result.data || [];
}

async function pullCloudState(client, userId) {
  const [itemRows, tagRows, preferenceRows] = await Promise.all([
    fetchOwnRows(client, 'snippets_items', userId),
    fetchOwnRows(client, 'snippets_tags', userId),
    fetchOwnRows(client, 'snippets_preferences', userId)
  ]);

  await dbClear('snippets');
  for (const row of itemRows) await dbPut('snippets', rowToSnippet(row));

  await dbClear('tags');
  for (const row of tagRows) {
    await dbPut('tags', { name: row.name, createdAt: new Date(row.created_at || Date.now()).getTime() });
  }

  if (preferenceRows[0]) {
    const preferences = rowToPreferences(preferenceRows[0]);
    await dbClear('preferences');
    for (const [key, value] of Object.entries(preferences)) await dbPut('preferences', { key, value });
    if (preferences.themeMode) localStorage.setItem('snippets:themeMode', preferences.themeMode);
  }

  return { itemCount: itemRows.length, tagCount: tagRows.length, preferencesMissing: !preferenceRows[0] };
}

async function enqueueLocalSnapshot() {
  const [snippets, tags, preferences] = await Promise.all([
    dbGetAll('snippets'), dbGetAll('tags'), getPreferences()
  ]);
  for (const snippet of snippets) {
    await enqueueSyncOperation({ id: `item:${snippet.id}`, type: 'upsert-item', payload: snippet });
  }
  for (const tag of tags) {
    await enqueueSyncOperation({ id: `tag:${tag.name}`, type: 'upsert-tag', payload: tag });
  }
  await enqueueSyncOperation({ id: 'preferences', type: 'upsert-preferences', payload: preferences });
}

async function initialCloudSync(client, userId, { adoptExistingCache = false } = {}) {
  if (adoptExistingCache) await enqueueLocalSnapshot();
  const flushed = await flushCloudQueue(client, userId);
  if (flushed.failed) return { online: false, flushed, pulled: null };

  const pulled = await pullCloudState(client, userId);
  if (pulled.preferencesMissing) {
    await enqueueSyncOperation({ id: 'preferences', type: 'upsert-preferences', payload: await getPreferences() });
    await flushCloudQueue(client, userId);
  }
  return { online: true, flushed, pulled };
}

function startCloudSync(client, userId, { intervalMs = 2500, onError = console.warn } = {}) {
  let stopped = false;
  let running = false;
  async function flush() {
    if (stopped || running) return;
    running = true;
    try { await flushCloudQueue(client, userId); }
    catch (error) { onError(error); }
    finally { running = false; }
  }
  async function reconcile() {
    if (stopped || running) return;
    running = true;
    try {
      const result = await flushCloudQueue(client, userId);
      if (!result.failed) await pullCloudState(client, userId);
    } catch (error) { onError(error); }
    finally { running = false; }
  }
  const timer = setInterval(flush, intervalMs);
  const onOnline = () => reconcile();
  const onFocus = () => reconcile();
  globalThis.addEventListener?.('online', onOnline);
  globalThis.addEventListener?.('focus', onFocus);
  return () => {
    stopped = true;
    clearInterval(timer);
    globalThis.removeEventListener?.('online', onOnline);
    globalThis.removeEventListener?.('focus', onFocus);
  };
}

function parseTodoLine(line = '') {
  const match = String(line).match(/^(\s*[-*+]\s+\[([ xX])\]\s+)(.*)$/);
  if (!match) return null;
  const checked = match[2].toLowerCase() === 'x';
  return { prefix: match[1], checked, text: match[3] };
}

function escapeHtml(value = '') {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function renderInlineMarkdown(source = '', { autoLink = true } = {}) {
  const protectedLinks = [];
  const protectedCode = [];
  const original = String(source);
  const looksLikeCodeSource = /^\s*(?:javascript:|data:text\/html)/i.test(original);

  let html = escapeHtml(original)
    .replace(/`([^`]+)`/g, (_match, code) => {
      const token = `%%SNIPPETSCODE${protectedCode.length}%%`;
      protectedCode.push(`<code>${code}</code>`);
      return token;
    })
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, (_match, label, href) => {
      const token = `%%SNIPPETSLINK${protectedLinks.length}%%`;
      protectedLinks.push(`<a href="${href}" target="_blank" rel="noopener noreferrer" tabindex="-1">${label}</a>`);
      return token;
    });

  html = html
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/__([^_]+)__/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
    .replace(/(^|[^_])_([^_]+)_/g, '$1<em>$2</em>')
    .replace(/~~([^~]+)~~/g, '<s>$1</s>')
    .replace(/==([^=]+)==/g, '<mark>$1</mark>');

  if (autoLink && !looksLikeCodeSource) {
    html = html.replace(/(^|[^@\w])((?:https?:\/\/|www\.)[^\s<]+|(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}(?:\/[^\s<]*)?)/g, (_match, prefix, match) => {
      let url = match;
      let trailing = '';
      while (/[.,!?;:)\]]$/.test(url)) {
        trailing = url.slice(-1) + trailing;
        url = url.slice(0, -1);
      }
      const href = /^https?:\/\//i.test(url) ? url : `https://${url}`;
      return `${prefix}<a href="${href}" target="_blank" rel="noopener noreferrer" tabindex="-1">${url}</a>${trailing}`;
    });
  }

  protectedLinks.forEach((link, index) => {
    html = html.replace(`%%SNIPPETSLINK${index}%%`, link);
  });
  protectedCode.forEach((code, index) => {
    html = html.replace(`%%SNIPPETSCODE${index}%%`, code);
  });
  return html;
}

function splitLineForDisplay(line = '') {
  const todo = parseTodoLine(line);
  if (todo) return { type: 'todo', ...todo };
  const heading = String(line).match(/^(#{1,6})\s+(.*)$/);
  if (heading) return { type: 'heading', level: heading[1].length, text: heading[2] };
  const quote = String(line).match(/^>\s?(.*)$/);
  if (quote) return { type: 'quote', text: quote[1] };
  const bullet = String(line).match(/^\s*[-*+]\s+(.*)$/);
  if (bullet) return { type: 'bullet', text: bullet[1] };
  return { type: 'text', text: String(line) };
}

function selectionAfterFormatting(previousSelection, nextSelection) {

const MARKERS = Object.freeze({
  bold: ['**', '**'],
  italic: ['_', '_'],
  highlight: ['==', '=='],
  strike: ['~~', '~~'],
  code: ['`', '`']
});

function editableParts(line) {
  const todo = parseTodoLine(line);

  return { prefix: '', text: String(line) };
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(Number(value) || 0, max));
}

function wrapSegment(text, start, end, before, after = before) {
  const source = String(text);
  const safeStart = clamp(start, 0, source.length);
  const safeEnd = clamp(end, safeStart, source.length);
  if (safeEnd <= safeStart) return { text: source, start: safeStart, end: safeEnd };
  const selected = source.slice(safeStart, safeEnd);

  if (
    source.slice(Math.max(0, safeStart - before.length), safeStart) === before &&
    source.slice(safeEnd, safeEnd + after.length) === after
  ) {
    return {
      text: source.slice(0, safeStart - before.length) + selected + source.slice(safeEnd + after.length),
      start: safeStart - before.length,
      end: safeEnd - before.length
    };
  }

  if (
    before === after && selected.startsWith(before) && selected.endsWith(after) &&
    selected.length > before.length + after.length
  ) {
    const inner = selected.slice(before.length, -after.length);
    return {
      text: source.slice(0, safeStart) + inner + source.slice(safeEnd),
      start: safeStart,
      end: safeStart + inner.length
    };
  }

  return {
    text: source.slice(0, safeStart) + before + selected + after + source.slice(safeEnd),
    start: safeStart + before.length,
    end: safeEnd + before.length
  };
}

function normalizeLinkHref(value = '') {
  const raw = String(value ?? '').trim();
  if (!raw) return null;
  const candidate = /^[a-z][a-z0-9+.-]*:/i.test(raw) ? raw : `https://${raw}`;
  try {
    const url = new URL(candidate);
    if (!['http:', 'https:'].includes(url.protocol)) return null;
    return url.pathname === '/' && !url.search && !url.hash ? url.href.slice(0, -1) : url.href;
  } catch {
    return null;
  }
}

function applyInlineFormat(doc, selection, type, options = {}) {
  const lines = String(doc ?? '').split('\n');
  if (!lines.length) return { doc: String(doc ?? ''), selection };
  let startLine = clamp(selection?.startLine, 0, lines.length - 1);
  let endLine = clamp(selection?.endLine, 0, lines.length - 1);
  let startOffset = Number(selection?.startOffset) || 0;
  let endOffset = Number(selection?.endOffset) || 0;
  if (endLine < startLine) {
    [startLine, endLine] = [endLine, startLine];
    [startOffset, endOffset] = [endOffset, startOffset];
  }

  let before;
  let after;
  if (type === 'link') {
    const href = normalizeLinkHref(options.href);
    if (!href) return { doc: lines.join('\n'), selection: { startLine, startOffset, endLine, endOffset } };
    before = '[';
    after = `](${href})`;
  } else {
    [before, after] = MARKERS[type] || [];
    if (!before) return { doc: lines.join('\n'), selection: { startLine, startOffset, endLine, endOffset } };
  }

  let nextStart = startOffset;
  let nextEnd = endOffset;
  for (let index = startLine; index <= endLine; index += 1) {
    const parts = editableParts(lines[index] ?? '');
    const from = index === startLine ? clamp(startOffset, 0, parts.text.length) : 0;
    const to = index === endLine ? clamp(endOffset, from, parts.text.length) : parts.text.length;
    if (to <= from) continue;
    const formatted = wrapSegment(parts.text, from, to, before, after);
    lines[index] = parts.prefix + formatted.text;
    if (index === startLine) nextStart = formatted.start;
    if (index === endLine) nextEnd = formatted.end;
  }

  return {
    doc: lines.join('\n'),
    selection: { startLine, startOffset: nextStart, endLine, endOffset: nextEnd }
  };
}

function toggleTodoLines(doc, startLine, endLine = startLine) {
  const lines = String(doc ?? '').split('\n');
  const from = clamp(Math.min(startLine, endLine), 0, lines.length - 1);
  const to = clamp(Math.max(startLine, endLine), from, lines.length - 1);
  const allTodos = lines.slice(from, to + 1).every(line => Boolean(parseTodoLine(line)));

  for (let index = from; index <= to; index += 1) {
    const line = lines[index] ?? '';
    const todo = parseTodoLine(line);
    if (allTodos) {
      lines[index] = todo?.text ?? line;
      continue;
    }
    if (todo) continue;
    const bullet = line.match(/^\s*[-*+]\s+(.*)$/);
    lines[index] = `- [ ] ${bullet ? bullet[1] : line}`;
  }

  return { doc: lines.join('\n'), startLine: from, endLine: to, isTodo: !allTodos };
}


function setHeadingLevel(doc, startLine, endLine = startLine, level = 1) {
  const lines = String(doc ?? '').split('\n');
  if (!lines.length) return { doc: String(doc ?? ''), startLine: 0, endLine: 0, isHeading: false, level: null };
  const safeLevel = clamp(level, 1, 4);
  const from = clamp(Math.min(startLine, endLine), 0, lines.length - 1);
  const to = clamp(Math.max(startLine, endLine), from, lines.length - 1);
  const prefix = '#'.repeat(safeLevel);
  const selected = lines.slice(from, to + 1);
  const allSameLevel = selected.every(line => new RegExp(`^${prefix}\\s+`).test(line));

  for (let index = from; index <= to; index += 1) {
    const line = lines[index] ?? '';
    const todo = parseTodoLine(line);
    const source = todo ? todo.text : line;
    const text = source.replace(/^#{1,6}\s+/, '');
    lines[index] = allSameLevel ? text : `${prefix} ${text}`;
  }

  return { doc: lines.join('\n'), startLine: from, endLine: to, isHeading: !allSameLevel, level: allSameLevel ? null : safeLevel };
}

function toggleHeadingLines(doc, startLine, endLine = startLine) {
  return setHeadingLevel(doc, startLine, endLine, 1);
}

function insertInlineMarkersAtCaret(doc, lineIndex, offset, marker, closingMarker = marker) {
  const lines = String(doc ?? '').split('\n');
  if (!lines.length) lines.push('');
  const index = clamp(lineIndex, 0, lines.length - 1);
  const parts = editableParts(lines[index] ?? '');
  const caret = clamp(offset, 0, parts.text.length);
  lines[index] = parts.prefix + parts.text.slice(0, caret) + marker + closingMarker + parts.text.slice(caret);
  return { doc: lines.join('\n'), lineIndex: index, caretOffset: caret + String(marker).length };
}

function insertLinkAtCaret(doc, lineIndex, offset, href) {
  const normalized = normalizeLinkHref(href);
  if (!normalized) return { doc: String(doc ?? ''), lineIndex: clamp(lineIndex, 0, Math.max(0, String(doc ?? '').split('\n').length - 1)), caretOffset: Math.max(0, Number(offset) || 0) };
  return insertInlineMarkersAtCaret(doc, lineIndex, offset, '[', `](${normalized})`);
}

function parseSlashQuery(lineText, caretOffset) {
  const text = String(lineText ?? '');
  const end = Math.max(0, Math.min(Number(caretOffset) || 0, text.length));
  const beforeCaret = text.slice(0, end);
  const start = beforeCaret.lastIndexOf('/');
  if (start < 0) return null;
  if (start > 0 && !/\s/.test(beforeCaret[start - 1])) return null;
  const query = beforeCaret.slice(start + 1);
  if (query.includes('\n') || query.includes('\r')) return null;
  return { start, end, query };
}

function slashCommandsForContext({ starred = false, pinned = false, archived = false } = {}) {
  return BASE_COMMANDS.map(command => {
    let label = command.label;
    if (command.id === 'star') label = starred ? 'Unstar' : 'Star';
    else if (command.id === 'pin') label = pinned ? 'Unpin' : 'Pin';
    else if (command.id === 'archive') label = archived ? 'Unarchive' : 'Archive';
    return { ...command, label, aliases: [...command.aliases] };
  });
}

function commandScore(command, rawQuery) {
  const query = normalize(rawQuery);
  if (!query) return 10;
  const values = [command.label, ...(command.aliases || [])].map(normalize);
  if (values.some(value => value === query)) return 0;
  if (values.some(value => value.startsWith(query))) return 1;
  if (values.some(value => value.includes(query))) return 2;
  return Infinity;
}

function filterSlashCommands(commands, query = '') {
  return (commands || [])
    .map((command, index) => ({ command, index, score: commandScore(command, query) }))
    .filter(entry => Number.isFinite(entry.score))
    .sort((a, b) => a.score - b.score || a.index - b.index)
    .map(entry => entry.command);

function editableLength(line = '') {
  const todo = parseTodoLine(line);

function resolveArrowNavigation(doc, lineIndex, caretOffset, key) {
  const lines = String(doc).split('\n');
  const index = Math.max(0, Math.min(Number(lineIndex) || 0, lines.length - 1));
  const offset = Math.max(0, Number(caretOffset) || 0);
  const currentLength = editableLength(lines[index]);

  if (key === 'ArrowLeft') {
    if (offset !== 0 || index === 0) return null;
    return { lineIndex: index - 1, caretOffset: editableLength(lines[index - 1]) };
  }
  if (key === 'ArrowRight') {
    if (offset < currentLength || index >= lines.length - 1) return null;
    return { lineIndex: index + 1, caretOffset: 0 };
  }
  if (key === 'ArrowUp') {
    if (index === 0) return null;
    return { lineIndex: index - 1, caretOffset: Math.min(offset, editableLength(lines[index - 1])) };
  }
  if (key === 'ArrowDown') {
    if (index >= lines.length - 1) return null;
    return { lineIndex: index + 1, caretOffset: Math.min(offset, editableLength(lines[index + 1])) };
  }
  return null;
}

function applyEditorLineInput(doc, lineIndex, text, caretOffset) {
  const parts = lines(doc);

  const currentTodo = parseTodoLine(current);
  const rawText = String(text);
  const rawCaret = Math.max(0, Math.min(Number(caretOffset) || 0, rawText.length));

  if (currentTodo) {
    parts[lineIndex] = `${currentTodo.checked ? '- [x] ' : '- [ ] '}${rawText}`;
    return { doc: parts.join('\n'), becameTodo: false, caretOffset: rawCaret };

  parts[lineIndex] = rawText;

  }

  return {

function offsetWithin(element, container, containerOffset) {
  if (!element || !container || !element.contains(container)) return 0;
  const range = document.createRange();
  range.selectNodeContents(element);
  try { range.setEnd(container, containerOffset); }
  catch { return 0; }
  return range.toString().length;
}

function selectionOffset(element) {
  const selection = window.getSelection();
  if (!selection || selection.rangeCount === 0 || !element.contains(selection.anchorNode)) return 0;
  return offsetWithin(element, selection.anchorNode, selection.anchorOffset);
}

function selectionOffsets(element) {
  const selection = window.getSelection();
  if (!selection || selection.rangeCount === 0) return { start: 0, end: 0 };
  const active = selection.getRangeAt(0);
  if (!element.contains(active.startContainer) || !element.contains(active.endContainer)) return { start: 0, end: 0 };
  const a = offsetWithin(element, active.startContainer, active.startOffset);
  const b = offsetWithin(element, active.endContainer, active.endOffset);
  return { start: Math.min(a, b), end: Math.max(a, b) };
}

function toggleInlineMarker(text, start, end, marker) {
  const source = String(text);
  if (end <= start) return { text: source, start, end };
  const markerLength = marker.length;
  const selected = source.slice(start, end);
  if (selected.startsWith(marker) && selected.endsWith(marker) && selected.length > markerLength * 2) {
    const inner = selected.slice(markerLength, -markerLength);
    return {
      text: source.slice(0, start) + inner + source.slice(end),
      start,
      end: start + inner.length
    };
  }
  if (source.slice(Math.max(0, start - markerLength), start) === marker && source.slice(end, end + markerLength) === marker) {
    return {
      text: source.slice(0, start - markerLength) + selected + source.slice(end + markerLength),
      start: start - markerLength,
      end: end - markerLength
    };
  }
  return {
    text: source.slice(0, start) + marker + selected + marker + source.slice(end),
    start: start + markerLength,
    end: end + markerLength
  };
}

function isFencedCodeLine(source, lineIndex) {
  const lines = String(source).split('\n');
  let inFence = false;
  for (let i = 0; i <= lineIndex && i < lines.length; i += 1) {

    if (fence) {
      if (i === lineIndex) return true;
      inFence = !inFence;

    }
    if (i === lineIndex) return inFence;
  }

}

  const todo = parseTodoLine(line);
  return todo ? todo.text : String(line);
}

  const lines = doc.split('\n');

  const end = Math.max(fromIndex, toIndex);

function spanForNode(surface, node) {
  if (!node || !surface.contains(node)) return null;
  const element = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
  return element?.closest?.('.editor-line-text') || null;
}

function lineIndexForSpan(span) {
  const index = Number(span?.dataset?.lineIndex);
  return Number.isInteger(index) ? index : null;

    if (remaining <= length) return { node, offset: remaining };
    remaining -= length;
    node = walker.nextNode();
  }
  if (lastText) return { node: lastText, offset: lastText.textContent?.length || 0 };
  return { node: element, offset: 0 };

    if (!element.isConnected) return;
    const startPoint = textPointForOffset(element, start);
    const endPoint = textPointForOffset(element, end);
    const range = document.createRange();
    range.setStart(startPoint.node, startPoint.offset);
    range.setEnd(endPoint.node, endPoint.offset);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);

    if (!startElement?.isConnected || !endElement?.isConnected) return;

    const range = document.createRange();
    range.setStart(startPoint.node, startPoint.offset);
    range.setEnd(endPoint.node, endPoint.offset);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
  });
