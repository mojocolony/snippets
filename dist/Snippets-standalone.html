    if (!startSpan || !endSpan || startIndex == null || endIndex == null) return null;
    const lines = doc.split('\n');
    const rawStart = offsetWithin(startSpan, range.startContainer, range.startOffset);
    const rawEnd = offsetWithin(endSpan, range.endContainer, range.endOffset);
    const startOffset = startSpan.classList.contains('is-editing')
      ? rawStart
      : displayOffsetToEditable(lines[startIndex] ?? '', rawStart);
    const endOffset = endSpan.classList.contains('is-editing')
      ? rawEnd
      : displayOffsetToEditable(lines[endIndex] ?? '', rawEnd);
    return { selection, range, startSpan, endSpan, startIndex, endIndex, startOffset, endOffset };
  }

  function currentFormattingSelection() {
    const info = rangeLineInfo();
    if (!info) return null;
    const selection = window.getSelection();
    return {
      startLine: info.startIndex,
      startOffset: info.startOffset,
      endLine: info.endIndex,
      endOffset: info.endOffset,
      collapsed: Boolean(selection?.isCollapsed),
      rect: info.range.getBoundingClientRect()
    };
  }

  function rememberEditorSelection(snapshot = currentFormattingSelection()) {
    if (!snapshot) return rememberedEditorSelection;
    rememberedEditorSelection = {
      startLine: snapshot.startLine,
      startOffset: snapshot.startOffset,
      endLine: snapshot.endLine,
      endOffset: snapshot.endOffset,
      collapsed: Boolean(snapshot.collapsed),
      rect: snapshot.rect || null
    };
    return rememberedEditorSelection;
  }

  function defaultEditorSelection() {
    const lines = doc.split('\n');
    const lineIndex = Number.isInteger(activeLineIndex)
      ? Math.max(0, Math.min(activeLineIndex, lines.length - 1))
      : 0;
    const offset = editableTextForLine(lines[lineIndex] ?? '').length;
    return {
      startLine: lineIndex,
      startOffset: offset,
      endLine: lineIndex,
      endOffset: offset,
      collapsed: true,
      rect: null
    };
  }

  function currentCaretRect() {
    const selection = window.getSelection();
    if (!selection || selection.rangeCount === 0) return null;
    const range = selection.getRangeAt(0).cloneRange();
    range.collapse(false);
    const rect = range.getBoundingClientRect();
    if (rect && (rect.width || rect.height || rect.top || rect.left)) return rect;
    return spanForNode(surface, selection.anchorNode)?.getBoundingClientRect?.() || null;
  }

  function closeSlashPalette() {
    slashState = null;
    slashPalette.close();
  }

  function syncSlashPalette() {
    if (destroyed || wholeDocumentSelected) return closeSlashPalette();
    const info = selectionLineInfo();
    if (!info || !info.selection?.isCollapsed || !info.span.classList.contains('is-editing')) return closeSlashPalette();
    const parsed = parseSlashQuery(info.span.textContent || '', info.offset);
    if (!parsed) return closeSlashPalette();
    slashState = { lineIndex: info.index, ...parsed };
    let context = {};
    try { context = commandContext?.() || {}; } catch { context = {}; }
    const commands = filterSlashCommands(slashCommandsForContext(context), parsed.query);
    slashPalette.open({ commands, rect: currentCaretRect(), isTouch: touchFormattingLayout });
  }

  function removeSlashToken(state) {
    if (!state || !Number.isInteger(state.lineIndex)) return null;
    const lines = doc.split('\n');
    const raw = lines[state.lineIndex] ?? '';
    const editable = editableTextForLine(raw);
    const start = Math.max(0, Math.min(state.start, editable.length));
    const end = Math.max(start, Math.min(state.end, editable.length));
    const nextText = editable.slice(0, start) + editable.slice(end);
    const result = applyEditorLineInput(doc, state.lineIndex, nextText, start);
    const beforeLine = result.doc.split('\n')[state.lineIndex] ?? '';
    doc = result.doc;
    activeLineIndex = state.lineIndex;
    return { lineIndex: state.lineIndex, caretOffset: result.caretOffset, line: beforeLine };
  }

  function headingPrefixLength(line) {
    return String(line ?? '').match(/^#{1,6}\s+/)?.[0].length || 0;
  }

  async function executeSlashCommand(commandId) {
    const state = slashState ? { ...slashState } : null;
    if (!state) return false;

    let normalizedHref = null;
    if (commandId === 'link') {
      normalizedHref = normalizeLinkHref(prompt('Link URL'));
      if (!normalizedHref) return false;
    }

    const removed = removeSlashToken(slashState);
    if (!removed) return false;
    closeSlashPalette();

    if (commandId === 'todo') {
      const result = toggleTodoLines(doc, removed.lineIndex, removed.lineIndex);
      doc = result.doc;
      activeLineIndex = removed.lineIndex;
      render(removed.lineIndex, Math.min(removed.caretOffset, editableTextForLine(doc.split('\n')[removed.lineIndex] ?? '').length));
      notify();
      return true;
    }

    if (/^heading-[1-4]$/.test(commandId)) {
      const level = Number(commandId.slice(-1));
      const beforeLine = doc.split('\n')[removed.lineIndex] ?? '';
      const result = setHeadingLevel(doc, removed.lineIndex, removed.lineIndex, level);
      doc = result.doc;
      const afterLine = doc.split('\n')[removed.lineIndex] ?? '';
      const contentOffset = Math.max(0, removed.caretOffset - headingPrefixLength(beforeLine));
      const nextCaret = contentOffset + headingPrefixLength(afterLine);
      activeLineIndex = removed.lineIndex;
      render(removed.lineIndex, nextCaret);
      notify();
      return true;
    }

    const markerByCommand = { bold: '**', italic: '_', strike: '~~', highlight: '==' };
    if (markerByCommand[commandId]) {
      const result = insertInlineMarkersAtCaret(doc, removed.lineIndex, removed.caretOffset, markerByCommand[commandId]);
      doc = result.doc;
      activeLineIndex = result.lineIndex;
      render(result.lineIndex, result.caretOffset);
      notify();
      return true;
    }

    if (commandId === 'link') {
      const result = insertLinkAtCaret(doc, removed.lineIndex, removed.caretOffset, normalizedHref);
      doc = result.doc;
      activeLineIndex = result.lineIndex;
      render(result.lineIndex, result.caretOffset);
      notify();
      return true;
    }

    render(removed.lineIndex, removed.caretOffset);
    notify();
    await onAppCommand?.(commandId);
    return true;
  }

  function hideFormattingPalette() {
    formattingSelection = null;
    palette.hidden = true;
    palette.classList.remove('is-keyboard-accessory');
    palette.style.width = '';
  }

  function updateFormattingPalette() {
    formattingSyncFrame = null;
    if (destroyed) return;
    const liveSnapshot = currentFormattingSelection();
    if (liveSnapshot) rememberEditorSelection(liveSnapshot);
    const snapshot = liveSnapshot || (formattingInteractionActive ? formattingSelection : null);
    const selectionInsideEditor = surface.contains(window.getSelection()?.anchorNode);
    if (
      !shouldShowFormattingPalette(snapshot, { suspended: formattingSuspended }) ||
      (!selectionInsideEditor && !formattingInteractionActive)
    ) {
      hideFormattingPalette();
      return;
    }
    formattingSelection = snapshot;
    palette.hidden = false;

    const viewportHeight = visualViewport?.height || window.innerHeight || 0;
    const useKeyboardAccessory = shouldAnchorFormattingBarToKeyboard({
      touchLayout: touchFormattingLayout,
      baselineHeight: formattingViewportBaselineHeight,
      viewportHeight
    });
    palette.classList.toggle('is-keyboard-accessory', useKeyboardAccessory);
    syncFormattingPaletteActions();

    if (useKeyboardAccessory) {
      const viewport = visualViewport || {
        offsetLeft: 0,
        offsetTop: 0,
        width: window.innerWidth,
        height: window.innerHeight
      };
      const geometry = keyboardAccessoryGeometry(viewport, { toolbarHeight: palette.offsetHeight || 48 });
      palette.style.left = `${geometry.left}px`;
      palette.style.top = `${geometry.top}px`;
      palette.style.bottom = 'auto';
      palette.style.width = `${geometry.width}px`;
      return;
    }

    palette.style.width = '';
    const width = palette.offsetWidth || 300;
    const half = width / 2;
    const center = snapshot.rect.left + snapshot.rect.width / 2;
    palette.style.left = `${Math.max(half + 8, Math.min(window.innerWidth - half - 8, center))}px`;
    palette.style.top = `${Math.max(10, snapshot.rect.top - 8)}px`;
    palette.style.bottom = 'auto';
  }

  function queueFormattingPalette() {
    if (destroyed || formattingSyncFrame != null) return;
    formattingSyncFrame = requestAnimationFrame(updateFormattingPalette);
  }

  function openHeadingChooser(snapshot, anchor) {
    if (!snapshot || snapshot.collapsed) return;
    formattingSelection = { ...snapshot };
    rememberEditorSelection(snapshot);
    const linesBefore = doc.split('\n');
    const startDisplayOffset = Math.max(0, snapshot.startOffset - headingPrefixLength(linesBefore[snapshot.startLine] ?? ''));
    const endDisplayOffset = Math.max(0, snapshot.endOffset - headingPrefixLength(linesBefore[snapshot.endLine] ?? ''));
    headingLevelMenu?.close?.(false);
    headingLevelMenu = openHeadingLevelMenu({
      anchor: anchor || palette.querySelector('[data-format-action="heading"]') || palette,
      onSelect(level) {
        headingLevelMenu = null;
        const result = setHeadingLevel(doc, snapshot.startLine, snapshot.endLine, level);
        if (result.doc === doc) return;
        doc = result.doc;
        wholeDocumentSelected = false;
        activeLineIndex = null;
        render();
        notify();
        const startElement = surface.querySelector(`.editor-line-text[data-line-index="${snapshot.startLine}"]`);
        const endElement = surface.querySelector(`.editor-line-text[data-line-index="${snapshot.endLine}"]`);
        if (startElement && endElement) {
          setTextRangeSelection(surface, startElement, startDisplayOffset, endElement, endDisplayOffset);
          requestAnimationFrame(() => requestAnimationFrame(queueFormattingPalette));
        }
      },
      onClose() {
        headingLevelMenu = null;
        queueFormattingPalette();
      }
    });
  }

  function applyFormattingAction(action) {
    const snapshot = currentFormattingSelection() || formattingSelection || rememberedEditorSelection || defaultEditorSelection();
    if (!snapshot) return;
    rememberEditorSelection(snapshot);

    if (action === 'heading') {
      openHeadingChooser(snapshot, formattingActionAnchor || palette.querySelector('[data-format-action="heading"]'));
      return;
    }

    if (action === 'todo') {
      const result = toggleTodoLines(doc, snapshot.startLine, snapshot.endLine);
      doc = result.doc;
      wholeDocumentSelected = false;
      const lines = doc.split('\n');
      const caretLine = snapshot.collapsed ? snapshot.startLine : snapshot.endLine;
      const caretOffset = snapshot.collapsed
        ? Math.min(snapshot.startOffset, editableTextForLine(lines[caretLine] ?? '').length)
        : editableTextForLine(lines[caretLine] ?? '').length;
      activeLineIndex = caretLine;
      render(caretLine, caretOffset);
      notify();
      return;
    }

    if (snapshot.collapsed) return;
    const options = {};
    if (action === 'link') {
      const href = prompt('Link URL');
      if (!href) return;
      options.href = href;
    }
    const result = applyInlineFormat(doc, snapshot, action, options);
    if (result.doc === doc) return;
    const nextSelection = selectionAfterFormatting(snapshot, result.selection);
    doc = result.doc;
    wholeDocumentSelected = false;
    formattingSelection = { ...nextSelection };
    rememberEditorSelection(nextSelection);
    notify();

    if (nextSelection.startLine === nextSelection.endLine) {
      activeLineIndex = nextSelection.startLine;
      render();
      const target = surface.querySelector(`.editor-line-text[data-line-index="${activeLineIndex}"]`);
      if (target) setTextSelection(surface, target, nextSelection.startOffset, nextSelection.endOffset);
      return;
    }

    const lines = doc.split('\n');
    activeLineIndex = nextSelection.endLine;
    render(activeLineIndex, editableTextForLine(lines[activeLineIndex] ?? '').length);
  }

  function replaceSelectionFromSnapshot(snapshot, insertText = '') {
    if (!snapshot || snapshot.collapsed) return false;
    const result = replaceEditorSelection(doc, snapshot, insertText);
    window.getSelection()?.removeAllRanges();
    hideFormattingPalette();
    rememberedEditorSelection = {
      startLine: result.lineIndex,
      startOffset: result.caretOffset,
      endLine: result.lineIndex,
      endOffset: result.caretOffset,
      collapsed: true,
      rect: null
    };
    doc = result.doc;
    wholeDocumentSelected = false;
    activeLineIndex = result.lineIndex;
    render(result.lineIndex, result.caretOffset);
    notify();
    return true;
  }

  function replaceCrossLineSelection(insertText = '') {
    const snapshot = currentFormattingSelection();
    if (!snapshot || snapshot.startLine === snapshot.endLine) return false;
    return replaceSelectionFromSnapshot(snapshot, insertText);
  }

  function selectWholeDocument() {
    const spans = [...surface.querySelectorAll('.editor-line-text')];
    if (!spans.length) return;
    const range = document.createRange();
    range.setStart(spans[0], 0);
    range.setEnd(spans.at(-1), spans.at(-1).childNodes.length);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    wholeDocumentSelected = true;
  }

  function queueSelectionSync() {
    if (destroyed || selectionSyncFrame != null) return;
    selectionSyncFrame = requestAnimationFrame(() => {
      selectionSyncFrame = null;
      if (destroyed || wholeDocumentSelected) return;
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0 || !selection.isCollapsed || !surface.contains(selection.anchorNode)) return;
      const info = selectionLineInfo();
      if (!info || info.index === activeLineIndex) return;
      activateLine(info.index, info.offset);
    });
  }

  surface.addEventListener('pointerdown', event => {
    formattingSuspended = false;
    hideFormattingPalette();
    const link = event.target.closest?.('a');
    const span = event.target.closest?.('.editor-line-text');
    if (link && span && !span.classList.contains('is-editing')) event.preventDefault();
  });

  surface.addEventListener('click', event => {
    const link = event.target.closest?.('a');
    const span = event.target.closest?.('.editor-line-text');
    if (!link || !span || span.classList.contains('is-editing')) return;
    event.preventDefault();
    event.stopPropagation();
    window.open(link.href, '_blank', 'noopener,noreferrer');
  });

  surface.addEventListener('pointerup', () => { queueSelectionSync(); queueFormattingPalette(); });
  surface.addEventListener('keyup', event => {
    if (/^(Arrow|Home|End)/.test(event.key)) { queueSelectionSync(); queueFormattingPalette(); }
  });

  palette.addEventListener('pointerdown', event => {
    const button = event.target.closest?.('[data-format-action]');
    if (!button) return;
    event.preventDefault();
    const snapshot = currentFormattingSelection() || formattingSelection || rememberedEditorSelection;
    if (snapshot) {
      formattingSelection = { ...snapshot };
      rememberEditorSelection(snapshot);
    }
    formattingInteractionActive = true;
    pointerFormattingAction = button.dataset.formatAction;
    formattingActionAnchor = button;
    applyFormattingAction(button.dataset.formatAction);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      formattingInteractionActive = false;
      queueFormattingPalette();
    }));
    setTimeout(() => { pointerFormattingAction = null; formattingActionAnchor = null; }, 0);
  });
  palette.addEventListener('click', event => {
    const button = event.target.closest?.('[data-format-action]');
    if (!button) return;
    if (pointerFormattingAction === button.dataset.formatAction) return;
    formattingActionAnchor = button;
    applyFormattingAction(button.dataset.formatAction);
    formattingActionAnchor = null;
  });

  surface.addEventListener('input', event => {
    if (wholeDocumentSelected) return;
    let span = event.target.closest?.('.editor-line-text') || null;
    if (!span) span = selectionLineInfo()?.span || null;
    const index = lineIndexForSpan(span);
    if (!span || index == null) return;
    if (activeLineIndex !== index) activeLineIndex = index;
    const offset = selectionOffset(span);
    const result = applyEditorLineInput(doc, index, span.textContent, offset);
    doc = result.doc;
    if (result.becameTodo) render(index, result.caretOffset);
    else queueGutterSync();
    notify();
    requestAnimationFrame(syncSlashPalette);
  });

  surface.addEventListener('keydown', event => {
    formattingSuspended = false;
    if (slashPalette.isOpen()) {
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        event.stopPropagation();
        slashPalette.moveActive(1);
        return;
      }
      if (event.key === 'ArrowUp') {
        event.preventDefault();
        event.stopPropagation();
        slashPalette.moveActive(-1);
        return;
      }
      if (event.key === 'Enter' && slashPalette.executeActive()) {
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      if (event.key === 'Escape') {
        event.preventDefault();
        event.stopPropagation();
        closeSlashPalette();
        return;
      }
    }
    if (isSelectAllShortcut(event)) {
      event.preventDefault();
      event.stopPropagation();
      selectWholeDocument();
      return;
    }

    const selection = window.getSelection();
    const info = selectionLineInfo();
    const formatKey = event.key.toLowerCase();
    const formatModifier = (event.metaKey || event.ctrlKey) && !event.altKey;
    if (formatModifier && !event.shiftKey && (formatKey === 'b' || formatKey === 'i')) {
      event.preventDefault();
      event.stopPropagation();
      if (!info || !selection || selection.isCollapsed || info.index !== activeLineIndex) return;
      const rangeInfo = rangeLineInfo();
      if (!rangeInfo || rangeInfo.startIndex !== rangeInfo.endIndex) return;
      const { start, end } = selectionOffsets(info.span);
      if (end <= start) return;
      const marker = formatKey === 'b' ? '**' : '_';
      const formatted = toggleInlineMarker(info.span.textContent, start, end, marker);
      const result = applyEditorLineInput(doc, info.index, formatted.text, formatted.end);
      doc = result.doc;
      activeLineIndex = info.index;
      renderLine(info.index);
      notify();
      const target = surface.querySelector(`.editor-line-text[data-line-index="${info.index}"]`);
      if (target) setTextSelection(surface, target, formatted.start, formatted.end);
      return;
    }

    if (!info || !selection?.isCollapsed) return;
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      const result = splitLineAt(doc, info.index, info.offset);
      doc = result.doc;
      activeLineIndex = result.lineIndex;
      render(result.lineIndex, result.caretOffset);
      notify();
      return;
    }
    if (event.key === 'Backspace' && info.offset === 0) {
      const result = backspaceAtLineStart(doc, info.index);
      if (!result.handled) return;
      event.preventDefault();
      doc = result.doc;
      activeLineIndex = result.lineIndex;
      render(result.lineIndex, result.caretOffset);
      notify();
    }
  });

  surface.addEventListener('paste', event => {
    if (wholeDocumentSelected) {
      event.preventDefault();
      event.stopPropagation();
      doc = event.clipboardData?.getData('text/plain')?.replace(/\r/g, '') ?? '';
      wholeDocumentSelected = false;
      const lines = doc.split('\n');
      activeLineIndex = lines.length - 1;
      render(activeLineIndex, editableTextForLine(lines.at(-1) || '').length);
      notify();
      return;
    }

    const text = event.clipboardData?.getData('text/plain') ?? '';
    const rangeInfo = rangeLineInfo();
    if (rangeInfo && rangeInfo.startIndex !== rangeInfo.endIndex) {
      event.preventDefault();
      replaceCrossLineSelection(text);
      return;
    }
    if (!text.includes('\n')) return;
    const info = selectionLineInfo();
    if (!info) return;
    event.preventDefault();
    const currentLines = doc.split('\n');
    const current = currentLines[info.index] ?? '';
    const todo = parseTodoLine(current);
    const editable = todo ? todo.text : current;
    const before = editable.slice(0, info.offset);
    const after = editable.slice(info.offset);
    const pasted = text.replace(/\r/g, '').split('\n');
    const replacement = [before + pasted[0], ...pasted.slice(1, -1), pasted.at(-1) + after];
    if (todo) replacement[0] = `${todo.checked ? '- [x] ' : '- [ ] '}${replacement[0]}`;
    currentLines.splice(info.index, 1, ...replacement);
    doc = currentLines.join('\n');
    const targetIndex = info.index + replacement.length - 1;
    const targetOffset = pasted.at(-1).length;
    activeLineIndex = targetIndex;
    render(targetIndex, targetOffset);
    notify();
  });

  surface.addEventListener('copy', event => {
    if (!wholeDocumentSelected) return;
    event.preventDefault();
    event.clipboardData?.setData('text/plain', doc);
  });

  surface.addEventListener('cut', event => {
    if (!wholeDocumentSelected) return;
    event.preventDefault();
    event.clipboardData?.setData('text/plain', doc);
    doc = '';
    wholeDocumentSelected = false;
    activeLineIndex = 0;
    render(0, 0);
    notify();
  });

  surface.addEventListener('beforeinput', event => {
    if (wholeDocumentSelected) {
      if (event.inputType === 'insertFromPaste') return;
      if (event.inputType?.startsWith('delete')) {
        event.preventDefault();
        doc = '';
        wholeDocumentSelected = false;
        activeLineIndex = 0;
        render(0, 0);
        notify();
        return;
      }
      if (event.inputType === 'insertText' || event.inputType === 'insertCompositionText') {
        event.preventDefault();
        doc = event.data || '';
        wholeDocumentSelected = false;
        activeLineIndex = 0;
        render(0, doc.length);
        notify();
      }
      return;
    }

    const snapshot = currentFormattingSelection();
    if (!snapshot || snapshot.collapsed) return;
    if (event.inputType === 'insertFromPaste') return;
    if (event.inputType?.startsWith('delete')) {
      event.preventDefault();
      replaceSelectionFromSnapshot(snapshot, '');
      return;
    }
    if (event.inputType === 'insertText' || event.inputType === 'insertCompositionText') {
      event.preventDefault();
      replaceSelectionFromSnapshot(snapshot, event.data || '');
    }
  }, true);

  surface.addEventListener('blur', event => {
    if (destroyed || (event.relatedTarget && host.contains(event.relatedTarget))) return;
    hideFormattingPalette();
    deactivateActiveLine();
  });

  const handleSelectionChange = () => {
    if (destroyed) return;
    const selection = window.getSelection();
    if (wholeDocumentSelected) {
      if (!selection || selection.rangeCount === 0 || selection.isCollapsed) wholeDocumentSelected = false;
      else return;
    }
    const snapshot = currentFormattingSelection();
    if (snapshot) rememberEditorSelection(snapshot);
    queueSelectionSync();
    queueFormattingPalette();
    if (slashPalette.isOpen()) requestAnimationFrame(syncSlashPalette);
  };
  document.addEventListener('selectionchange', handleSelectionChange);

  const suspendFormattingPalette = () => {
    formattingSuspended = true;
    hideFormattingPalette();
  };
  const handleVisibilityChange = () => {
    if (document.hidden) suspendFormattingPalette();
    else hideFormattingPalette();
  };
  window.addEventListener('blur', suspendFormattingPalette);
  document.addEventListener('visibilitychange', handleVisibilityChange);

  const resizeHandler = () => { queueGutterSync(); queueFormattingPalette(); };
  const visualViewportHandler = () => {
    if (!visualViewport) return;
    if (visualViewport.height > formattingViewportBaselineHeight) formattingViewportBaselineHeight = visualViewport.height;
    queueFormattingPalette();
  };
  window.addEventListener('resize', resizeHandler);
  visualViewport?.addEventListener('resize', visualViewportHandler);
  visualViewport?.addEventListener('scroll', visualViewportHandler);
  const gutterObserver = typeof ResizeObserver === 'function' ? new ResizeObserver(queueGutterSync) : null;
  gutterObserver?.observe(surface);

  applyAppearance();
  render();

  return {
    getValue: () => doc,
    setValue(next) {
      doc = String(next ?? '');
      activeLineIndex = null;
      wholeDocumentSelected = false;
      rememberedEditorSelection = null;
      closeSlashPalette();
      headingLevelMenu?.close?.(false);
      headingLevelMenu = null;
      render();
    },
    focus() {
      const lines = doc.split('\n');
      const meaningful = lines.findIndex(line => line.trim().length > 0);
      const targetIndex = meaningful < 0 ? 0 : meaningful;
      const offset = editableTextForLine(lines[targetIndex] ?? '').length;
      activateLine(targetIndex, offset);
    },
    toggleTodo() {
      applyFormattingAction('todo');
    },
    updateAppearance({ fontFamily: nextFamily = fontFamily, fontSize: nextSize = fontSize } = {}) {
      applyAppearance(nextFamily, nextSize);
    },
    destroy() {
      destroyed = true;
      if (selectionSyncFrame != null) cancelAnimationFrame(selectionSyncFrame);
      if (formattingSyncFrame != null) cancelAnimationFrame(formattingSyncFrame);
      if (gutterSyncFrame != null) cancelAnimationFrame(gutterSyncFrame);
      gutterObserver?.disconnect();
      window.removeEventListener('resize', resizeHandler);
      visualViewport?.removeEventListener('resize', visualViewportHandler);
      visualViewport?.removeEventListener('scroll', visualViewportHandler);
      window.removeEventListener('blur', suspendFormattingPalette);
      document.removeEventListener('visibilitychange', handleVisibilityChange);
      document.removeEventListener('selectionchange', handleSelectionChange);
      slashPalette.destroy();
      headingLevelMenu?.close?.(false);
      headingLevelMenu = null;
      surface.contentEditable = 'false';
      host.replaceChildren();
    }
  };
}


// ---- src/ui/toast.js ----
let currentToast = null;
let currentTimer = null;

function showToast(message, { duration = 1800 } = {}) {
  currentToast?.remove();
  clearTimeout(currentTimer);
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.setAttribute('role', 'status');
  toast.textContent = message;
  document.body.append(toast);
  currentToast = toast;
  currentTimer = setTimeout(() => {
    toast.remove();
    if (currentToast === toast) currentToast = null;
  }, duration);
}


// ---- src/ui/sheet.js ----
function createSheet({ title = '', className = '', onClose = () => {}, animateBackdrop = true } = {}) {
  const backdrop = document.createElement('div');
  backdrop.className = `sheet-backdrop${animateBackdrop ? '' : ' sheet-backdrop-no-fade'}`;
  backdrop.setAttribute('role', 'presentation');

  const sheet = document.createElement('section');
  sheet.className = `sheet ${className}`.trim();
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-modal', 'true');
  if (title) sheet.setAttribute('aria-label', title);

  const head = document.createElement('div');
  head.className = 'sheet-head';
  const heading = document.createElement('div');
  heading.className = 'sheet-title';
  heading.textContent = title;
  const close = document.createElement('button');
  close.type = 'button';
  close.className = 'quiet-button';
  close.setAttribute('aria-label', `Close ${title || 'dialog'}`);
  close.textContent = '×';
  head.append(heading, close);

  const body = document.createElement('div');
  body.className = 'sheet-body';
  sheet.append(head, body);
  backdrop.append(sheet);

  function destroy() {
    document.removeEventListener('keydown', onKey);
    backdrop.remove();
    onClose();
  }
  function onKey(event) {
    if (event.key === 'Escape') destroy();
  }
  close.addEventListener('click', destroy);
  backdrop.addEventListener('pointerdown', event => {
    if (event.target === backdrop) destroy();
  });
  document.addEventListener('keydown', onKey);
  document.body.append(backdrop);

  return { backdrop, sheet, body, close: destroy };
}


// ---- src/ui/tagSheet.js ----
function openTagSheet({
  mode = 'assign',
  tags = [],
  assigned = [],
  mixed = [],
  activeTag = null,
  onToggle = async () => assigned,
  onCreate = async () => assigned,
  onSelect = () => {},
  onClear = () => {},
  onClose = () => {}
} = {}) {
  const sheet = createSheet({ title: mode === 'assign' ? 'Tags' : 'All tags', onClose });
  const input = document.createElement('input');
  input.className = 'sheet-search';
  input.type = 'search';
  input.placeholder = mode === 'assign' ? 'Search or create tag…' : 'Search tags…';
  input.autocomplete = 'off';
  sheet.body.append(input);

  const list = document.createElement('div');
  list.className = 'tag-sheet-list';
  sheet.body.append(list);
  let currentAssigned = [...assigned];
  let currentMixed = [...mixed];
  let query = '';

  async function render() {
    list.replaceChildren();
    const normalizedQuery = normalizeTag(query);
    const filtered = tags.filter(tag => tag.name.includes(normalizedQuery));

    if (mode === 'filter' && activeTag) {
      const clear = document.createElement('button');
      clear.type = 'button';
      clear.className = 'sheet-row';
      const clearLabel = document.createElement('span');
      clearLabel.textContent = 'All snippets';
      const clearHint = document.createElement('span');
      clearHint.className = 'sheet-count';
      clearHint.textContent = 'clear filter';
      clear.append(clearLabel, clearHint);
      clear.addEventListener('click', () => { onClear(); sheet.close(); });
      list.append(clear);
    }

    for (const tag of filtered) {
      if (mode === 'assign') {
        const label = document.createElement('label');
        label.className = 'sheet-row';
        const name = document.createElement('span');
        name.textContent = tag.name;
        const check = document.createElement('input');
        check.type = 'checkbox';
        check.checked = currentAssigned.includes(tag.name);
        check.indeterminate = currentMixed.includes(tag.name);
        check.setAttribute('aria-label', tag.name);
        check.addEventListener('change', async () => {
          check.disabled = true;
          try {
            const result = await onToggle(tag.name, check.checked);
            if (Array.isArray(result)) {
              currentAssigned = result;
              currentMixed = [];
            } else if (result) {
              currentAssigned = [...(result.assigned || [])];
              currentMixed = [...(result.mixed || [])];
            }
          } finally { check.disabled = false; render(); }
        });
        label.append(name, check);
        list.append(label);
      } else {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'sheet-row';
        const name = document.createElement('span');
        name.textContent = tag.name;
        const count = document.createElement('span');
        count.className = 'sheet-count';
        count.textContent = String(tag.count);
        button.append(name, count);
        if (tag.name === activeTag) button.classList.add('is-active');
        button.addEventListener('click', () => { onSelect(tag.name); sheet.close(); });
        list.append(button);
      }
    }

    if (mode === 'assign' && normalizedQuery && !tags.some(tag => tag.name === normalizedQuery)) {
      const create = document.createElement('button');
      create.type = 'button';
      create.className = 'sheet-row create-tag';
      create.setAttribute('aria-label', `Create ${normalizedQuery}`);
      create.textContent = `+ Create “${normalizedQuery}”`;
      create.addEventListener('click', async () => {
        create.disabled = true;
        try {
          const result = await onCreate(normalizedQuery, true);
          if (Array.isArray(result)) {
            currentAssigned = result;
            currentMixed = [];
          } else if (result) {
            currentAssigned = [...(result.assigned || [])];
            currentMixed = [...(result.mixed || [])];
          }
          tags = [...tags, { name: normalizedQuery, count: 1 }].sort((a, b) => a.name.localeCompare(b.name));
          query = '';
          input.value = '';
          render();
        } finally { create.disabled = false; }
      });
      list.append(create);
    }

    if (!filtered.length && !(mode === 'assign' && normalizedQuery)) {
      const empty = document.createElement('div');
      empty.className = 'library-empty';
      empty.textContent = 'No matching tags';
      list.append(empty);
    }
  }

  input.addEventListener('input', () => { query = input.value; render(); });
  render();
  requestAnimationFrame(() => input.focus());
  return sheet;
}

  const accountLabel = document.createElement('div');
  accountLabel.className = 'sheet-section-label';

  account.className = 'settings-account';

  password.type = 'password';
  password.autocomplete = 'new-password';

const ACTIONS = [
  ['newSnippet', 'New snippet'],
  ['inbox', 'Inbox'],
  ['starred', 'Starred'],
  ['archive', 'Archive'],
  ['toggleStar', 'Star / unstar'],
  ['tags', 'Tags'],
  ['toggleSidebar', 'Toggle sidebar']
];

function isMacPlatform() {
  return /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent || '');
}

function openShortcutSheet({ shortcuts = DEFAULT_SHORTCUTS, onChange = async () => shortcuts, onRestore = async () => DEFAULT_SHORTCUTS } = {}) {
  let current = { ...DEFAULT_SHORTCUTS, ...(shortcuts || {}) };
  const isMac = isMacPlatform();
  let captureAction = null;
  let feedback;
  let list;

  function cleanup() {
    document.removeEventListener('keydown', capture, true);
    delete document.body.dataset.shortcutCapture;
  }

  const sheet = createSheet({ title: 'Keyboard shortcuts', className: 'shortcut-sheet', onClose: cleanup });

  const intro = document.createElement('p');
  intro.className = 'shortcut-intro';
  intro.textContent = 'Select a shortcut, then press a new key combination.';
  sheet.body.append(intro);

  list = document.createElement('div');
  list.className = 'shortcut-list';
  sheet.body.append(list);

  feedback = document.createElement('div');
  feedback.className = 'shortcut-feedback';
  feedback.setAttribute('aria-live', 'polite');
  sheet.body.append(feedback);

  const restore = document.createElement('button');
  restore.type = 'button';
  restore.className = 'menu-row shortcut-restore';
  restore.textContent = 'Restore defaults';
  restore.addEventListener('click', async () => {
    current = await onRestore();
    feedback.textContent = 'Defaults restored.';
    render();
  });
  sheet.body.append(restore);

  function actionLabel(action) {
    return ACTIONS.find(([id]) => id === action)?.[1] || action;
  }

  function render() {
    list.replaceChildren();
    for (const [action, label] of ACTIONS) {
      const row = document.createElement('div');
      row.className = 'shortcut-row';
      const name = document.createElement('span');
      name.className = 'shortcut-name';
      name.textContent = label;
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'shortcut-key';
      button.dataset.shortcutAction = action;
      button.textContent = captureAction === action ? 'Press shortcut…' : formatShortcut(current[action], { isMac });
      button.addEventListener('click', () => {
        captureAction = action;
        feedback.textContent = 'Use Command/Ctrl with another key.';
        document.body.dataset.shortcutCapture = 'true';
        render();
      });
      row.append(name, button);
      list.append(row);
    }
  }

  async function capture(event) {
    if (!captureAction) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    if (event.key === 'Escape') {
      captureAction = null;
      delete document.body.dataset.shortcutCapture;
      feedback.textContent = 'Shortcut unchanged.';
      render();
      return;
    }
    const candidate = shortcutFromEvent(event);
    if (!candidate) {
      feedback.textContent = 'Use Command/Ctrl with another key.';
      return;
    }
    const conflict = findShortcutConflict(current, captureAction, candidate);
    if (conflict) {
      feedback.textContent = `${formatShortcut(candidate, { isMac })} is already used by ${actionLabel(conflict)}.`;
      return;
    }
    const warning = isLikelyReservedShortcut(candidate)
      ? ' This combination may be reserved by your browser.'
      : '';
    current = await onChange(captureAction, candidate);
    feedback.textContent = `Shortcut saved.${warning}`;
    captureAction = null;
    delete document.body.dataset.shortcutCapture;
    render();
  }

  document.addEventListener('keydown', capture, true);
  render();
  return sheet;
}

// ---- src/ui/slashCommandPalette.js ----
function clamp(value, min, max) {
  return Math.max(min, Math.min(value, max));
}

function keyboardIsOpen(visualViewport, baselineHeight) {
  if (!visualViewport || !baselineHeight) return false;
  return baselineHeight - visualViewport.height > 120;
}

function createSlashCommandPalette({ host = document.body, onExecute = () => {}, onDismiss = () => {} } = {}) {
  const panel = document.createElement('div');
  panel.className = 'slash-command-palette';
  panel.setAttribute('role', 'listbox');
  panel.setAttribute('aria-label', 'Commands');
  panel.hidden = true;
  host.append(panel);

  let commands = [];
  let activeIndex = 0;
  let lastRect = null;
  let touchLayout = false;
  let baselineHeight = Math.max(window.visualViewport?.height || 0, window.innerHeight || 0);

  function position(rect = lastRect) {
    if (panel.hidden) return;
    lastRect = rect || lastRect;
    const vv = window.visualViewport;
    if (vv?.height > baselineHeight) baselineHeight = vv.height;
    const panelWidth = Math.min(320, Math.max(260, window.innerWidth - 24));
    const panelHeight = panel.offsetHeight || 300;

    if (touchLayout && keyboardIsOpen(vv, baselineHeight)) {
      const left = (vv?.offsetLeft || 0) + 12;
      const width = Math.max(220, (vv?.width || window.innerWidth) - 24);
      const top = Math.max((vv?.offsetTop || 0) + 12, (vv?.offsetTop || 0) + (vv?.height || window.innerHeight) - panelHeight - 12);
      Object.assign(panel.style, { left: `${left}px`, top: `${top}px`, width: `${width}px` });
      panel.classList.add('is-keyboard-accessory');
      return;
    }

    panel.classList.remove('is-keyboard-accessory');
    panel.style.width = `${panelWidth}px`;
    const anchor = lastRect || { left: 16, right: 16, top: 56, bottom: 56, width: 0, height: 0 };
    const viewportTop = vv?.offsetTop || 0;
    const viewportLeft = vv?.offsetLeft || 0;
    const viewportWidth = vv?.width || window.innerWidth;
    const viewportHeight = vv?.height || window.innerHeight;
    const left = clamp(anchor.left, viewportLeft + 8, viewportLeft + viewportWidth - panelWidth - 8);
    const roomBelow = viewportTop + viewportHeight - anchor.bottom;
    const top = roomBelow >= Math.min(panelHeight, 300) + 12
      ? anchor.bottom + 8
      : Math.max(viewportTop + 8, anchor.top - panelHeight - 8);
    Object.assign(panel.style, { left: `${left}px`, top: `${top}px` });
  }

  function render() {
    panel.replaceChildren();
    if (!commands.length) {
      const empty = document.createElement('div');
      empty.className = 'slash-command-empty';
      empty.textContent = 'No commands';
      panel.append(empty);
      position();
      return;
    }

    commands.forEach((command, index) => {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'slash-command-row';
      row.dataset.commandId = command.id;
      row.setAttribute('role', 'option');
      row.setAttribute('aria-selected', String(index === activeIndex));
      if (index === activeIndex) row.classList.add('is-active');
      const label = document.createElement('span');
      label.className = 'slash-command-label';
      label.textContent = command.label;
      const alias = document.createElement('span');
      alias.className = 'slash-command-alias';
      alias.textContent = command.aliases?.[0] ? `/${command.aliases[0]}` : '';
      row.append(label, alias);
      row.addEventListener('pointerdown', event => {
        event.preventDefault();
        activeIndex = index;
        render();
        void onExecute(command.id);
      });
      panel.append(row);
    });
    position();
    panel.querySelector('.slash-command-row.is-active')?.scrollIntoView?.({ block: 'nearest' });
  }

  function open({ commands: nextCommands = [], rect = null, isTouch = false } = {}) {
    commands = [...nextCommands];
    activeIndex = 0;
    lastRect = rect || lastRect;
    touchLayout = Boolean(isTouch);
    panel.hidden = false;
    render();
  }

  function update({ commands: nextCommands = commands, rect = lastRect, isTouch = touchLayout } = {}) {
    commands = [...nextCommands];
    activeIndex = Math.min(activeIndex, Math.max(0, commands.length - 1));
    lastRect = rect || lastRect;
    touchLayout = Boolean(isTouch);
    if (!panel.hidden) render();
  }

  function moveActive(delta) {
    if (!commands.length) return;
    activeIndex = (activeIndex + delta + commands.length) % commands.length;
    render();
  }

  function executeActive() {
    const command = commands[activeIndex];
    if (!command) return false;
    void onExecute(command.id);
    return true;
  }

  function close({ notify = false } = {}) {
    if (panel.hidden) return;
    panel.hidden = true;
    commands = [];
    activeIndex = 0;
    panel.classList.remove('is-keyboard-accessory');
    if (notify) onDismiss();
  }

  const outsidePointer = event => {
    if (panel.hidden || panel.contains(event.target)) return;
    close({ notify: true });
  };
  const viewportHandler = () => position();
  document.addEventListener('pointerdown', outsidePointer, true);
  window.visualViewport?.addEventListener('resize', viewportHandler);
  window.visualViewport?.addEventListener('scroll', viewportHandler);
  window.addEventListener('resize', viewportHandler);

  return {
    open,
    update,
    moveActive,
    executeActive,
    close,
    position,
    isOpen: () => !panel.hidden,
    contains: target => panel.contains(target),
    destroy() {
      document.removeEventListener('pointerdown', outsidePointer, true);
      window.visualViewport?.removeEventListener('resize', viewportHandler);
      window.visualViewport?.removeEventListener('scroll', viewportHandler);
      window.removeEventListener('resize', viewportHandler);
      panel.remove();
    }
  };
}


// ---- src/ui/headingLevelMenu.js ----
function openHeadingLevelMenu({ anchor, onSelect = () => {}, onClose = () => {} } = {}) {
  document.querySelector('.heading-level-menu')?.remove();
  const menu = document.createElement('div');
  menu.className = 'heading-level-menu';
  menu.setAttribute('role', 'menu');
  menu.setAttribute('aria-label', 'Heading level');

  const levels = [
    { level: 1, label: 'Heading 1' },
    { level: 2, label: 'Heading 2' },
    { level: 3, label: 'Heading 3' },
    { level: 4, label: 'Heading 4' }
  ];
  for (const { level, label } of levels) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'heading-level-button';
    button.dataset.headingLevel = String(level);
    button.setAttribute('role', 'menuitem');
    button.setAttribute('aria-label', label);
    button.textContent = `H${level}`;
    button.title = label;
    button.addEventListener('pointerdown', event => {
      event.preventDefault();
      event.stopPropagation();
      const chosen = Number(button.dataset.headingLevel);
      close(false);
      onSelect(chosen);
    });
    menu.append(button);
  }

  document.body.append(menu);
  const rect = anchor?.getBoundingClientRect?.() || { left: 12, top: 56, bottom: 56, width: 44 };
  const width = menu.offsetWidth || 188;
  const left = Math.max(8, Math.min(window.innerWidth - width - 8, rect.left + rect.width / 2 - width / 2));
  const top = Math.max(8, rect.top - (menu.offsetHeight || 48) - 8);
  menu.style.left = `${left}px`;
  menu.style.top = `${top}px`;

  const outside = event => {
    if (menu.contains(event.target)) return;
    close(true);
  };
  const escape = event => {
    if (event.key !== 'Escape') return;
    event.preventDefault();
    close(true);
  };
  requestAnimationFrame(() => document.addEventListener('pointerdown', outside, true));
  document.addEventListener('keydown', escape, true);

  function close(notify = true) {
    document.removeEventListener('pointerdown', outside, true);
    document.removeEventListener('keydown', escape, true);
    menu.remove();
    if (notify) onClose();
  }

  return { close };
}

function renderTags(container, tags = []) {
  container.replaceChildren(...tags.map(tag => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip';
    chip.textContent = tag;
    return chip;
  }));
}

function bindSidebarRow(row, id, {
  selectionMode = false,
  onOpenSnippet = () => {}, onStartSelection = () => {}, onToggleSelection = () => {}, onRangeSelect = () => {}
} = {}) {
  let longPressTimer = null;
  let suppressClick = false;
  const cancelLongPress = () => { clearTimeout(longPressTimer); longPressTimer = null; };
  row.addEventListener('pointerdown', event => {
    if (selectionMode || event.pointerType === 'mouse') return;
    cancelLongPress();
    longPressTimer = setTimeout(() => { suppressClick = true; onStartSelection(id); }, 450);
  });
  row.addEventListener('pointerup', cancelLongPress);
  row.addEventListener('pointercancel', cancelLongPress);
  row.addEventListener('pointerleave', cancelLongPress);
  row.addEventListener('click', event => {
    if (suppressClick) { suppressClick = false; event.preventDefault(); return; }
    if (selectionMode) {
      event.preventDefault();
      if (event.shiftKey) onRangeSelect(id);
      else onToggleSelection(id);
      return;
    }
    if (event.metaKey || event.ctrlKey) { event.preventDefault(); onStartSelection(id); return; }
    if (event.shiftKey) { event.preventDefault(); onRangeSelect(id); return; }
    onOpenSnippet(id);
  });
}

function renderSidebarList(container, snippets = [], currentId = null, {
  selectionMode = false, selectedIds = new Set(),
  onOpenSnippet = () => {}, onStartSelection = () => {}, onToggleSelection = () => {}, onRangeSelect = () => {}
} = {}) {
  const selected = selectedIds instanceof Set ? selectedIds : new Set(selectedIds || []);
  container.replaceChildren();
  if (!snippets.length) {
    const empty = document.createElement('div');
    empty.className = 'desktop-sidebar-empty';
    empty.textContent = 'No snippets';
    container.append(empty);
    return;
  }

  for (const snippet of snippets) {
    const item = makeLibraryItem(snippet);
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'desktop-sidebar-row';
    row.classList.toggle('is-current', !selectionMode && item.id === currentId);
    row.classList.toggle('is-selection-mode', selectionMode);
    row.classList.toggle('is-selected', selectionMode && selected.has(item.id));
    row.dataset.snippetId = item.id;

    if (selectionMode) {
      const indicator = document.createElement('span');
      indicator.className = 'selection-indicator desktop-selection-indicator';
      indicator.setAttribute('aria-hidden', 'true');
      if (selected.has(item.id)) indicator.textContent = '✓';
      row.append(indicator);
    }

    const titleRow = document.createElement('span');
    titleRow.className = 'desktop-sidebar-title-row';
    const title = document.createElement('span');
    title.className = 'desktop-sidebar-title';
    title.textContent = item.title || 'Untitled';
    const star = document.createElement('span');
    star.className = 'library-star';
    star.textContent = item.starred ? '★' : '';
    star.setAttribute('aria-hidden', 'true');
    titleRow.append(title, star);

    const preview = document.createElement('span');
    preview.className = 'desktop-sidebar-preview';
    preview.textContent = item.preview;

    const footer = document.createElement('span');
    footer.className = 'desktop-sidebar-footer';
    const tags = document.createElement('span');
    tags.className = 'desktop-sidebar-tags';
    tags.textContent = item.tags.join(' · ');
    const modified = document.createElement('time');
    modified.className = 'desktop-sidebar-modified';
    modified.dateTime = new Date(item.updatedAt).toISOString();
    modified.textContent = item.modified;
    footer.append(tags, modified);

    row.append(titleRow, preview, footer);
    bindSidebarRow(row, item.id, { selectionMode, onOpenSnippet, onStartSelection, onToggleSelection, onRangeSelect });
    container.append(row);
  }
}

  return {
    editor,

    getValue() { return editor.getValue(); },
    destroy() {
      window.removeEventListener('blur', clearTransientToolbarFocus);
      document.removeEventListener('visibilitychange', handleVisibilityChange);
      editor.destroy();

  };

function makeSegmented(options, active, onSelect, label) {
  const wrap = document.createElement('div');
  wrap.className = 'segmented';
  wrap.setAttribute('role', 'tablist');
  wrap.setAttribute('aria-label', label);
  for (const [value, text] of options) {
    const button = document.createElement('button');
    button.type = 'button';
    button.setAttribute('role', 'tab');
    button.setAttribute('aria-selected', String(value === active));
    button.textContent = text;
    button.addEventListener('click', () => onSelect(value));
    wrap.append(button);
  }
  return wrap;
}

function bindSelectableRow(row, id, {
  selectionMode = false,
  onOpen = () => {}, onStartSelection = () => {}, onToggleSelection = () => {}, onRangeSelect = () => {}
} = {}) {
  let longPressTimer = null;

  const cancelLongPress = () => {
    clearTimeout(longPressTimer);
    longPressTimer = null;
  };

  row.addEventListener('pointerdown', event => {
    if (selectionMode || event.pointerType === 'mouse') return;
    cancelLongPress();
    longPressTimer = setTimeout(() => {
      suppressClick = true;
      onStartSelection(id);
    }, 450);
  });
  row.addEventListener('pointerup', cancelLongPress);
  row.addEventListener('pointercancel', cancelLongPress);
  row.addEventListener('pointerleave', cancelLongPress);

  row.addEventListener('click', event => {
    if (suppressClick) {
      suppressClick = false;
      event.preventDefault();
      return;
    }
    if (selectionMode) {
      event.preventDefault();
      if (event.shiftKey) onRangeSelect(id);
      else onToggleSelection(id);
      return;
    }
    if (event.metaKey || event.ctrlKey) {
      event.preventDefault();
      onStartSelection(id);
      return;
    }
    if (event.shiftKey) {
      event.preventDefault();
      onRangeSelect(id);
      return;
    }
    onOpen(id);
  });
}
