        <button class="control-button control-more" data-action="more" aria-label="More" title="More">${batchIconMarkup('ellipsis')}</button>
      </nav>`}
    </main>`;
  const header = root.querySelector('.library-header');
  const list = root.querySelector('.library-list');

  if (activeTag) {
    const titleRow = document.createElement('div');
    titleRow.className = 'tag-filter-header';
    const title = document.createElement('div');
    title.className = 'tag-filter-title';
    title.textContent = `#${activeTag}`;
    const clear = document.createElement('button');
    clear.type = 'button'; clear.className = 'quiet-button'; clear.setAttribute('aria-label', 'Clear tag filter'); clear.textContent = '×';
    clear.addEventListener('click', onClearTag);
    titleRow.append(title, clear);
    header.append(titleRow, makeSegmented([['all', 'All'], ['inbox', 'Inbox'], ['starred', 'Starred'], ['archive', 'Archive']], tagScope, onTagScope, 'Tag scope'));
  } else {
    header.append(makeSegmented([['inbox', 'Inbox'], ['starred', 'Starred'], ['archive', 'Archive']], scope, onScope, 'Library view'));
  }

  if (searchOpen) {
    const searchWrap = document.createElement('div');
    searchWrap.className = 'search-wrap';
    const input = document.createElement('input');
    input.className = 'search-input';
    input.type = 'search';
    input.placeholder = 'Search snippets';
    input.value = query;
    input.addEventListener('input', () => onSearch(input.value));
    searchWrap.append(input);
    header.append(searchWrap);
    if (focusSearch) requestAnimationFrame(() => { input.focus(); input.setSelectionRange(input.value.length, input.value.length); });
  }

  if (!items.length) {
    const empty = document.createElement('div');
    empty.className = 'library-empty';
    empty.textContent = query ? 'No matching snippets' : activeTag ? `No snippets tagged ${activeTag}` : scope === 'archive' ? 'Archive is empty' : scope === 'starred' ? 'Nothing starred yet' : 'Inbox is empty';
    list.append(empty);
  } else {
    for (const snippet of items) {
      const item = makeLibraryItem(snippet);
      const row = document.createElement('button');
      row.type = 'button';
      row.className = `library-row${selectionMode ? ' is-selection-mode' : ''}${selected.has(item.id) ? ' is-selected' : ''}`;
      row.dataset.testid = 'library-row';
      row.dataset.snippetId = item.id;
      if (selectionMode) {
        const indicator = document.createElement('span');
        indicator.className = 'selection-indicator';
        indicator.setAttribute('aria-hidden', 'true');
        if (selected.has(item.id)) indicator.textContent = '✓';
        row.append(indicator);
      }
      const title = document.createElement('span');
      title.className = 'library-title';
      title.textContent = item.title || 'Untitled';
      const preview = document.createElement('span');
      preview.className = 'library-preview';
      preview.textContent = item.preview;
      const tags = document.createElement('span');
      tags.className = 'library-tags';
      for (const tag of item.tags) {
        const chip = document.createElement('span');
        chip.className = 'tag-chip';
        chip.textContent = tag;
        tags.append(chip);
      }
      const meta = document.createElement('span');
      meta.className = 'library-meta';
      const star = document.createElement('span');
      star.className = 'library-star';
      star.textContent = item.starred ? '★' : '';
      star.setAttribute('aria-hidden', 'true');
      const modified = document.createElement('time');
      modified.className = 'library-modified';
      modified.dateTime = new Date(item.updatedAt).toISOString();
      modified.textContent = item.modified;
      meta.append(star, modified);
      row.append(title, preview, tags, meta);
      bindSelectableRow(row, item.id, { selectionMode, onOpen, onStartSelection, onToggleSelection, onRangeSelect });
      list.append(row);
    }
  }

  if (selectionMode) {
    root.querySelector('[data-batch-action="star"]').addEventListener('click', onBatchStar);
    root.querySelector('[data-batch-action="archive"]').addEventListener('click', onBatchArchive);
    root.querySelector('[data-batch-action="tags"]').addEventListener('click', onBatchTags);
    root.querySelector('[data-batch-action="delete"]').addEventListener('click', onBatchDelete);
    root.querySelector('[data-batch-action="done"]').addEventListener('click', onDoneSelection);
    return;
  }

  const searchButton = root.querySelector('[data-action="search"]');
  searchButton.classList.toggle('is-active', searchOpen || Boolean(query));
  root.querySelector('[data-action="new"]').addEventListener('click', onNew);
  root.querySelector('[data-action="tags"]').addEventListener('click', onTags);
  searchButton.addEventListener('click', onToggleSearch);
  root.querySelector('[data-action="appearance"]').addEventListener('click', onAppearance);
  root.querySelector('[data-action="more"]').addEventListener('click', onMore);
}


// ---- src/ui/trashView.js ----
function bindTrashSelection(row, id, {
  selectionMode = false, onStartSelection = () => {}, onToggleSelection = () => {}, onRangeSelect = () => {}
} = {}) {
  let longPressTimer = null;
  let suppressClick = false;
  const cancelLongPress = () => { clearTimeout(longPressTimer); longPressTimer = null; };
  row.addEventListener('pointerdown', event => {
    if (event.target.closest('button') || selectionMode || event.pointerType === 'mouse') return;
    longPressTimer = setTimeout(() => { suppressClick = true; onStartSelection(id); }, 450);
  });
  row.addEventListener('pointerup', cancelLongPress);
  row.addEventListener('pointercancel', cancelLongPress);
  row.addEventListener('pointerleave', cancelLongPress);
  row.addEventListener('click', event => {
    if (event.target.closest('button')) return;
    if (suppressClick) { suppressClick = false; event.preventDefault(); return; }
    if (selectionMode) {
      if (event.shiftKey) onRangeSelect(id);
      else onToggleSelection(id);
      return;
    }
    if (event.metaKey || event.ctrlKey) { onStartSelection(id); return; }
    if (event.shiftKey) onRangeSelect(id);
  });
}

function batchStripMarkup(count) {
  const disabled = count ? '' : ' disabled';
  return `<nav class="control-strip batch-control-strip" aria-label="Selected Trash actions">
    <span class="batch-count" aria-live="polite">${count}</span>
    <button class="control-button" data-batch-action="restore"${disabled} aria-label="Restore selected" title="Restore">${batchIconMarkup('restore')}</button>
    <button class="control-button is-danger" data-batch-action="delete"${disabled} aria-label="Delete selected permanently" title="Delete permanently">${batchIconMarkup('trash')}</button>
    <button class="control-button" data-batch-action="done" aria-label="Done selecting" title="Done">${batchIconMarkup('x')}</button>
  </nav>`;
}

function renderTrashView(root, {
  items = [], selectionMode = false, selectedIds = new Set(),
  onBack = () => {}, onRestore = () => {}, onDeletePermanently = () => {}, onDeleteAll = () => {},
  onStartSelection = () => {}, onToggleSelection = () => {}, onRangeSelect = () => {},
  onSelect = () => {}, onDoneSelection = () => {}, onBatchRestore = () => {}, onBatchDelete = () => {}
} = {}) {
  const selected = selectedIds instanceof Set ? selectedIds : new Set(selectedIds || []);
  root.innerHTML = `
    <main class="trash-screen${selectionMode ? ' is-selection-mode' : ''}">
      <div class="trash-inner">
        <header class="trash-header">
          <button class="quiet-button" data-action="back" aria-label="Back">←</button>
          <div class="trash-title">Trash</div>
          <div class="trash-header-actions">
            ${items.length && !selectionMode ? '<button class="quiet-button trash-delete-all-button" data-action="delete-all" aria-label="Delete all snippets permanently">Delete All</button>' : ''}
            <button class="quiet-button trash-select-button" data-action="select" aria-label="Select snippets">${selectionMode ? 'Done' : 'Select'}</button>
          </div>
        </header>
        <section class="trash-list"></section>
      </div>
      ${selectionMode ? batchStripMarkup(selected.size) : ''}
    </main>`;
  root.querySelector('[data-action="back"]').addEventListener('click', onBack);
  root.querySelector('[data-action="select"]').addEventListener('click', selectionMode ? onDoneSelection : onSelect);
  root.querySelector('[data-action="delete-all"]')?.addEventListener('click', onDeleteAll);
  const list = root.querySelector('.trash-list');
  if (!items.length) {
    const empty = document.createElement('div');
    empty.className = 'library-empty';
    empty.textContent = 'Trash is empty';
    list.append(empty);
  } else {
    for (const snippet of items) {
      const row = document.createElement('div');
      row.className = `trash-row${selectionMode ? ' is-selection-mode' : ''}${selected.has(snippet.id) ? ' is-selected' : ''}`;
      row.dataset.testid = 'trash-row';
      row.dataset.snippetId = snippet.id;
      if (selectionMode) {
        const indicator = document.createElement('span');
        indicator.className = 'selection-indicator';
        indicator.setAttribute('aria-hidden', 'true');
        if (selected.has(snippet.id)) indicator.textContent = '✓';
        row.append(indicator);
      }
      const text = document.createElement('div');
      text.className = 'trash-row-text';
      const title = document.createElement('div');
      title.className = 'trash-row-title'; title.textContent = getSnippetTitle(snippet.content) || 'Untitled';
      const preview = document.createElement('div');
      preview.className = 'trash-row-preview'; preview.textContent = getSnippetPreview(snippet.content);
      text.append(title, preview);
      row.append(text);
      if (!selectionMode) {
        const actions = document.createElement('div'); actions.className = 'trash-actions';
        const restore = document.createElement('button'); restore.type = 'button'; restore.className = 'small-action'; restore.textContent = 'Restore';
        const del = document.createElement('button'); del.type = 'button'; del.className = 'small-action is-danger'; del.textContent = 'Delete';
        restore.addEventListener('click', () => onRestore(snippet.id));
        del.addEventListener('click', () => onDeletePermanently(snippet.id));
        actions.append(restore, del);
        row.append(actions);
      }
      bindTrashSelection(row, snippet.id, { selectionMode, onStartSelection, onToggleSelection, onRangeSelect });
      list.append(row);
    }
  }

  if (selectionMode) {
    root.querySelector('[data-batch-action="restore"]').addEventListener('click', onBatchRestore);
    root.querySelector('[data-batch-action="delete"]').addEventListener('click', onBatchDelete);
    root.querySelector('[data-batch-action="done"]').addEventListener('click', onDoneSelection);
  }
}


// ---- src/auth/authView.js ----
function element(tag, className, text = '') {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text) node.textContent = text;
  return node;
}

function renderAuthView(root, { onPasswordSignIn, onRequestLink, initialError = '' } = {}) {
  let email = '';
  let mode = 'password';
  let busy = false;
  let errorMessage = initialError;

  function setBusy(next, ...controls) {
    busy = next;
    controls.filter(Boolean).forEach(control => { control.disabled = next; });
  }

  function renderPasswordForm(panel) {
    const title = element('h1', 'auth-title', 'Sign in');
    const copy = element('p', 'auth-copy', 'Use your email and password to open your snippets.');
    panel.append(title, copy);

    const form = element('form', 'auth-form');
    const emailInput = document.createElement('input');
    emailInput.className = 'auth-input';
    emailInput.type = 'email';
    emailInput.name = 'email';
    emailInput.placeholder = 'Email';
    emailInput.autocomplete = 'email';
    emailInput.spellcheck = false;
    emailInput.value = email;

    const passwordInput = document.createElement('input');
    passwordInput.className = 'auth-input';
    passwordInput.type = 'password';
    passwordInput.name = 'password';
    passwordInput.placeholder = 'Password';
    passwordInput.autocomplete = 'current-password';

    const submit = element('button', 'auth-submit', busy ? 'Working…' : 'Sign in');
    submit.type = 'submit';
    submit.disabled = busy;

    const link = element('button', 'auth-back', 'Email me a sign-in link');
    link.type = 'button';
    link.disabled = busy;

    if (errorMessage) form.append(emailInput, passwordInput, submit, element('p', 'auth-error', errorMessage), link);
    else form.append(emailInput, passwordInput, submit, link);

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (busy) return;
      email = emailInput.value.trim();
      const password = passwordInput.value;
      errorMessage = '';
      if (!email) { errorMessage = 'Enter an email address.'; render(); return; }
      if (!password) { errorMessage = 'Enter your password.'; render(); return; }
      setBusy(true, submit, link);
      submit.textContent = 'Working…';
      try {
        await onPasswordSignIn?.(email, password);
      } catch (error) {
        errorMessage = error?.message || 'Could not sign in.';
        setBusy(false, submit, link);
        render();
      }
    });

    link.addEventListener('click', async () => {
      if (busy) return;
      email = emailInput.value.trim();
      errorMessage = '';
      if (!email) { errorMessage = 'Enter an email address.'; render(); return; }
      setBusy(true, submit, link);
      try {
        await onRequestLink?.(email);
        mode = 'link-sent';
        busy = false;
        render();
      } catch (error) {
        errorMessage = error?.message || 'Could not send the sign-in link.';
        setBusy(false, submit, link);
        render();
      }
    });

    panel.append(form);
    requestAnimationFrame(() => (email ? passwordInput : emailInput).focus());
  }

  function renderLinkSent(panel) {
    panel.append(
      element('h1', 'auth-title', 'Check your email'),
      element('p', 'auth-copy', `We sent a sign-in link to ${email}. Open it to finish signing in in a browser.`)
    );
    const back = element('button', 'auth-back', 'Use email and password');
    back.type = 'button';
    back.addEventListener('click', () => {
      mode = 'password';
      errorMessage = '';
      render();
    });
    panel.append(back);
  }

  function render() {
    root.replaceChildren();
    const main = element('main', 'auth-screen');
    const panel = element('section', 'auth-panel');
    const wordmark = element('div', 'auth-wordmark brand-lockup');
    wordmark.innerHTML = `${featherIconMarkup('brand-feather')}<span>Snippets</span>`;
    panel.append(wordmark);

    if (mode === 'password') renderPasswordForm(panel);
    else renderLinkSent(panel);

    main.append(panel);
    root.append(main);
  }

  render();
  return { setMode(nextMode) { mode = nextMode; render(); } };
}


// ---- src/app.js ----
function resolveTheme(mode) {
  if (mode === 'dark' || mode === 'light') return mode;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function applyTheme(mode) {
  const resolved = resolveTheme(mode);
  document.documentElement.dataset.theme = resolved;
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', resolved === 'dark' ? '#101010' : '#f8f8f6');
}

async function copyText(text) {
  if (navigator.clipboard?.writeText) {
    try { await navigator.clipboard.writeText(text); return; } catch { /* use fallback */ }
  }
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
  document.body.append(textarea);
  textarea.select();
  document.execCommand('copy');
  textarea.remove();
}

async function shareText(payload, fallbackText = '') {
  if (navigator.share) {
    try {
      await navigator.share(payload);
      return 'shared';
    } catch (error) {
      if (error?.name === 'AbortError') return 'cancelled';
    }
  }
  await copyText(fallbackText || [payload.title, payload.text, payload.url].filter(Boolean).join('\n\n'));
  return 'copied';
}

async function createApp(root, { onSignOut = null, onChangePassword = null } = {}) {
  const desktopMedia = matchMedia('(min-width: 900px)');
  const isDesktop = () => desktopMedia.matches;

  const state = {
    screen: 'editor',
    preferences: await getPreferences(),
    currentSnippet: null,
    currentContent: '',
    editorView: null,
    libraryScope: 'inbox',
    activeTag: null,
    tagScope: 'all',
    query: '',
    searchOpen: false,
    pendingMarkdown: null,
    saveTimer: null,
    savePromise: Promise.resolve(),
    selectionMode: false,
    selectedIds: new Set(),
    selectionAnchorId: null,
    trashReturn: null
  };
  state.preferences.keyboardShortcuts = { ...DEFAULT_SHORTCUTS, ...(state.preferences.keyboardShortcuts || {}) };
  state.preferences.sidebarCollapsed = Boolean(state.preferences.sidebarCollapsed);

  applyTheme(state.preferences.themeMode);
  await purgeExpiredTrash();

  const systemTheme = matchMedia('(prefers-color-scheme: dark)');
  const systemThemeHandler = () => {
    if (state.preferences.themeMode === 'system') applyTheme('system');
  };
  systemTheme.addEventListener?.('change', systemThemeHandler);

  function resetSelectionState() {
    state.selectionMode = false;
    state.selectedIds = new Set();
    state.selectionAnchorId = null;
  }

  function effectiveLibraryScope() {
    return state.activeTag ? state.tagScope : state.libraryScope;
  }

  async function currentSelectableItems() {
    if (state.screen === 'trash') {
      return (await listSnippets({ scope: 'trash' })).sort((a, b) => (b.deletedAt || 0) - (a.deletedAt || 0));
    }
    return listSnippets({
      scope: effectiveLibraryScope(),
      tag: state.activeTag,
      query: state.query
    });
  }

  async function syncSelectionUi() {
    if (state.screen === 'editor' && state.editorView) {
      state.editorView.setSelectionState({ active: state.selectionMode, ids: state.selectedIds });
      return;
    }
    if (state.screen === 'library') { await renderLibrary(); return; }
    if (state.screen === 'trash') await renderTrash();
  }

  async function enterSelectionMode(id = null) {
    state.selectionMode = true;
    state.selectedIds = new Set(id ? [id] : []);
    state.selectionAnchorId = id || state.selectionAnchorId;
    if (isDesktop() && state.screen === 'editor' && state.preferences.sidebarCollapsed) {
      state.preferences = await setPreference('sidebarCollapsed', false);
      state.editorView?.setSidebarCollapsed(false);
    }
    await syncSelectionUi();
  }

  async function toggleSelection(id) {
    if (!state.selectionMode) return enterSelectionMode(id);
    const next = new Set(state.selectedIds);
    if (next.has(id)) next.delete(id);
    else next.add(id);
    state.selectedIds = next;
    state.selectionAnchorId = id;
    await syncSelectionUi();
  }

  async function rangeSelect(id) {
    const items = await currentSelectableItems();
    const ids = items.map(item => item.id);
    const anchor = state.selectionAnchorId || state.currentSnippet?.id || id;
    const from = ids.indexOf(anchor);
    const to = ids.indexOf(id);
    if (from < 0 || to < 0) return enterSelectionMode(id);
    state.selectionMode = true;
    const next = new Set(state.selectedIds);
    for (const selectedId of ids.slice(Math.min(from, to), Math.max(from, to) + 1)) next.add(selectedId);
    state.selectedIds = next;
    state.selectionAnchorId = anchor;
    await syncSelectionUi();
  }

  async function selectedSnippets() {
    const results = await Promise.all([...state.selectedIds].map(id => getSnippet(id)));
    return results.filter(Boolean);
  }

  function summarizeTags(items) {
    const names = new Set(items.flatMap(item => item.tags || []));
    const assigned = [];
    const mixed = [];
    for (const name of names) {
      const count = items.filter(item => item.tags?.includes(name)).length;
      if (count === items.length) assigned.push(name);
      else if (count > 0) mixed.push(name);
    }
    return { assigned: assigned.sort(), mixed: mixed.sort() };
  }

  async function refreshAfterBatchMutation() {
    if (state.screen === 'trash') {
      const visible = await currentSelectableItems();
      const visibleIds = new Set(visible.map(item => item.id));
      state.selectedIds = new Set([...state.selectedIds].filter(id => visibleIds.has(id)));
      if (!state.selectedIds.size) resetSelectionState();
      await renderTrash();
      return;
    }

    const visible = await currentSelectableItems();
    const visibleIds = new Set(visible.map(item => item.id));
    state.selectedIds = new Set([...state.selectedIds].filter(id => visibleIds.has(id)));
    if (!state.selectedIds.size) resetSelectionState();

    if (state.screen === 'editor' && state.editorView) {
      if (state.currentSnippet && !visibleIds.has(state.currentSnippet.id)) {
        resetSelectionState();
        await showEditor(visible[0]?.id || null);
        return;
      }
      if (state.currentSnippet) {
        state.currentSnippet = await getSnippet(state.currentSnippet.id);
        state.editorView.updateMeta(state.currentSnippet);
      }
      await refreshDesktopSidebar();
      state.editorView?.setSelectionState({ active: state.selectionMode, ids: state.selectedIds });
      return;
    }
    await renderLibrary();
  }

  async function batchToggleStar() {
    const items = await selectedSnippets();
    if (!items.length) return;
    const target = !items.every(item => item.starred);
    for (const item of items) await updateSnippet(item.id, { starred: target });
    await refreshAfterBatchMutation();
  }

  async function batchToggleArchive() {
    const items = await selectedSnippets();
    if (!items.length) return;
    const target = !items.every(item => item.archived);
    for (const item of items) await updateSnippet(item.id, { archived: target });
    await refreshAfterBatchMutation();
  }

  async function openBatchTags() {
    let items = await selectedSnippets();
    if (!items.length) return;
    let tags = await listTagsWithCounts();
    let summary = summarizeTags(items);
    const known = new Set(tags.map(tag => tag.name));
    for (const name of [...summary.assigned, ...summary.mixed]) {
      if (!known.has(name)) tags.push({ name, count: items.filter(item => item.tags?.includes(name)).length });
    }
    tags = tags.sort((a, b) => a.name.localeCompare(b.name));
    openTagSheet({
      mode: 'assign',
      tags,
      assigned: summary.assigned,
      mixed: summary.mixed,
      onToggle: async (name, enabled) => {
        for (const item of items) await setSnippetTag(item.id, name, enabled);
        items = await selectedSnippets();
        summary = summarizeTags(items);
        await refreshAfterBatchMutation();
        return summary;
      },
      onCreate: async (name) => {
        for (const item of items) await setSnippetTag(item.id, name, true);
        items = await selectedSnippets();
        summary = summarizeTags(items);
        await refreshAfterBatchMutation();
        return summary;
      }
    });
  }

  async function batchMoveToTrash() {
    const items = await selectedSnippets();
    if (!items.length) return;
    for (const item of items) await moveToTrash(item.id);
    await refreshAfterBatchMutation();
  }

  async function finishSelection() {
    resetSelectionState();
    await syncSelectionUi();
  }

  async function refreshDesktopSidebar() {
    if (!isDesktop() || state.screen !== 'editor' || !state.editorView) return;
    const items = await listSnippets({ scope: state.libraryScope });
    state.editorView.updateSidebar(items, state.libraryScope, state.currentSnippet?.id || null);
  }

  async function toggleSidebar() {
    if (!isDesktop() || state.screen !== 'editor' || !state.editorView) return;
    state.preferences = await setPreference('sidebarCollapsed', !state.preferences.sidebarCollapsed);
    state.editorView.setSidebarCollapsed(state.preferences.sidebarCollapsed);
  }

  async function switchLibraryScope(scope) {
    resetSelectionState();
    state.libraryScope = scope;
    state.activeTag = null;
    state.tagScope = 'all';
    if (isDesktop() && state.screen === 'editor' && state.editorView) {
      await refreshDesktopSidebar();
      return;
    }
    await showLibrary(scope);
  }

  function handleLibraryControl() {
    if (isDesktop() && state.screen === 'editor') toggleSidebar();
    else showLibrary();
  }

  function queueSave(markdown) {
    state.currentContent = markdown;
    state.pendingMarkdown = markdown;
    state.editorView?.setShareEnabled(Boolean(markdown.trim()));
    clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(() => { flushSave(); }, 120);
  }

  async function flushSave() {
    clearTimeout(state.saveTimer);
    state.saveTimer = null;
    if (state.pendingMarkdown == null) return state.savePromise;
    const markdown = state.pendingMarkdown;
    state.pendingMarkdown = null;

    const operation = async () => {
      try {
        if (!state.currentSnippet) {
          if (!markdown.trim()) return;
          state.currentSnippet = await createSnippet(markdown);
        } else if (state.currentSnippet.content !== markdown) {
          state.currentSnippet = await updateSnippet(state.currentSnippet.id, { content: markdown });
        }
        state.editorView?.updateMeta(state.currentSnippet);
        await refreshDesktopSidebar();
      } catch (error) {
        console.error(error);
        showToast('Could not save — text is still on screen');
      }
    };
    state.savePromise = state.savePromise.then(operation, operation);
    return state.savePromise;
  }

  async function leaveEditor() {
    if (state.screen !== 'editor') return;
    await flushSave();
    if (state.currentSnippet && !state.currentContent.trim()) {
      try { await removeSnippetIfEmpty(state.currentSnippet.id); }
      catch (error) { console.error(error); showToast('Could not remove empty snippet'); }
    }
    state.editorView?.destroy();
    state.editorView = null;
    state.currentSnippet = null;
    state.currentContent = '';
    state.pendingMarkdown = null;
  }

  async function showEditor(id = null) {
    resetSelectionState();
    if (state.screen === 'editor' && state.editorView) await leaveEditor();
    state.screen = 'editor';
    state.currentSnippet = id ? await getSnippet(id) : null;
    state.currentContent = state.currentSnippet?.content || '';
    state.pendingMarkdown = null;

    const libraryItems = isDesktop() ? await listSnippets({ scope: state.libraryScope }) : [];
    state.editorView = renderEditorView(root, {
      content: state.currentContent,
      snippet: state.currentSnippet,
      preferences: state.preferences,
      libraryItems,
      libraryScope: state.libraryScope,
      sidebarCollapsed: state.preferences.sidebarCollapsed,
      selectionMode: state.selectionMode,
      selectedIds: state.selectedIds,
      onContentChange: queueSave,
      onLibrary: handleLibraryControl,
      onTags: () => openEditorTags(),
      onStar: () => toggleStar(),
      onAppearance: () => openAppearance(),
      onShare: () => shareCurrent(),
      onMore: () => openEditorMore(),
      onLibraryScope: scope => switchLibraryScope(scope),
      onOpenSnippet: id => showEditor(id),
      onNew: () => showEditor(null),
      onEditorCommand: id => handleEditorCommand(id),
      onStartSelection: id => enterSelectionMode(id),
      onToggleSelection: id => toggleSelection(id),
      onRangeSelect: id => rangeSelect(id),
      onBatchStar: () => batchToggleStar(),
      onBatchArchive: () => batchToggleArchive(),
      onBatchTags: () => openBatchTags(),
      onBatchDelete: () => batchMoveToTrash(),
      onDoneSelection: () => finishSelection()
    });
    requestAnimationFrame(() => state.editorView?.focus());
  }

  async function showLibrary(scope = state.libraryScope) {
    resetSelectionState();
    state.libraryScope = scope;
    if (isDesktop()) {
      state.activeTag = null;
      state.tagScope = 'all';
      if (state.screen === 'editor' && state.editorView) {
        await refreshDesktopSidebar();
        return;
      }
      await showEditor(null);
      return;
    }
    if (state.screen === 'editor') await leaveEditor();
    state.screen = 'library';
    await renderLibrary();
  }

  async function renderLibrary({ focusSearch = false } = {}) {
    const effectiveScope = state.activeTag ? state.tagScope : state.libraryScope;
    const items = await listSnippets({
      scope: effectiveScope,
      tag: state.activeTag,
      query: state.query
    });
    renderLibraryView(root, {
      scope: state.libraryScope,
      items,
      activeTag: state.activeTag,
      tagScope: state.tagScope,
      query: state.query,
      searchOpen: state.searchOpen,
      focusSearch,
      selectionMode: state.selectionMode,
      selectedIds: state.selectedIds,
      onScope: value => switchLibraryScope(value),
      onTagScope: async value => { state.tagScope = value; await renderLibrary(); },
      onClearTag: async () => { state.activeTag = null; state.tagScope = 'all'; await renderLibrary(); },
      onOpen: id => showEditor(id),
      onNew: () => showEditor(null),
      onTags: () => openLibraryTags(),
      onSearch: value => {
        state.query = value;
        clearTimeout(renderLibrary.searchTimer);
        renderLibrary.searchTimer = setTimeout(() => renderLibrary({ focusSearch: true }), 70);
      },
      onToggleSearch: () => {
        state.searchOpen = !state.searchOpen;
        if (!state.searchOpen) state.query = '';
        renderLibrary({ focusSearch: state.searchOpen });
      },
      onAppearance: () => openAppearance(),
      onMore: () => openLibraryMore(),
      onStartSelection: id => enterSelectionMode(id),
      onToggleSelection: id => toggleSelection(id),
      onRangeSelect: id => rangeSelect(id),
      onBatchStar: () => batchToggleStar(),
      onBatchArchive: () => batchToggleArchive(),
      onBatchTags: () => openBatchTags(),
      onBatchDelete: () => batchMoveToTrash(),
      onDoneSelection: () => finishSelection()
    });
  }

  async function openEditorTags() {
    const tags = await listTagsWithCounts();
    openTagSheet({
      mode: 'assign',
      tags,
      assigned: state.currentSnippet?.tags || [],
      onToggle: async name => {
        if (!state.currentContent.trim()) { showToast('Type something first'); return []; }
        await flushSave();
        if (!state.currentSnippet) return [];
        state.currentSnippet = await toggleSnippetTag(state.currentSnippet.id, name);
        state.editorView?.updateMeta(state.currentSnippet);
        await refreshDesktopSidebar();
        return [...state.currentSnippet.tags];
      },
      onCreate: async name => {
        if (!state.currentContent.trim()) { showToast('Type something first'); return []; }
        await flushSave();
        if (!state.currentSnippet) return [];
        state.currentSnippet = await toggleSnippetTag(state.currentSnippet.id, name);
        state.editorView?.updateMeta(state.currentSnippet);
        await refreshDesktopSidebar();
        return [...state.currentSnippet.tags];
      }
    });
  }

  async function openLibraryTags() {
    const tags = await listTagsWithCounts();
    openTagSheet({
      mode: 'filter',
      tags,
      activeTag: state.activeTag,
      onSelect: name => {
        state.activeTag = name;
        state.tagScope = 'all';
        state.query = '';
        renderLibrary();
      },
      onClear: () => {
        state.activeTag = null;
        state.tagScope = 'all';
        renderLibrary();
      }
    });
  }

  async function toggleStar() {
    if (!state.currentContent.trim()) return;
    await flushSave();
    if (!state.currentSnippet) return;
    state.currentSnippet = await updateSnippet(state.currentSnippet.id, { starred: !state.currentSnippet.starred });
    state.editorView?.updateMeta(state.currentSnippet);
    await refreshDesktopSidebar();
  }

  async function togglePin() {
    if (!state.currentContent.trim()) return;
    await flushSave();
    if (!state.currentSnippet) return;
    await setPinnedSnippet(state.currentSnippet.pinned ? null : state.currentSnippet.id);
    state.currentSnippet = await getSnippet(state.currentSnippet.id);
    state.editorView?.updateMeta(state.currentSnippet);
    await refreshDesktopSidebar();
  }

  async function toggleArchive() {
    if (!state.currentContent.trim()) return;
    await flushSave();
    if (!state.currentSnippet) return;
    const currentId = state.currentSnippet.id;
    const wasArchived = Boolean(state.currentSnippet.archived);
    const inboxBefore = !wasArchived && state.libraryScope === 'inbox'
      ? await listSnippets({ scope: 'inbox' })
      : [];
    state.currentSnippet = await updateSnippet(currentId, { archived: !wasArchived });
    state.editorView?.updateMeta(state.currentSnippet);
    if (!wasArchived && state.libraryScope === 'inbox') {
      if (isDesktop()) {
        const nextId = chooseNextVisibleSnippet(inboxBefore, currentId);
        await showEditor(nextId);
      } else {
        await showLibrary('inbox');
      }
      return;
    }
    await refreshDesktopSidebar();
  }

  async function handleEditorCommand(id) {
    if (id === 'star') { await toggleStar(); return; }
    if (id === 'pin') { await togglePin(); return; }
    if (id === 'archive') { await toggleArchive(); return; }
    if (id === 'tags') { await openEditorTags(); return; }
    if (id === 'new') { await showEditor(null); return; }
    if (id === 'select') {
      if (isDesktop()) {
        if (state.preferences.sidebarCollapsed) {
          state.preferences = await setPreference('sidebarCollapsed', false);
          state.editorView?.setSidebarCollapsed(false);
        }
        await enterSelectionMode();
        return;
      }
      await showLibrary(state.libraryScope);
      await enterSelectionMode();
    }
  }

  function openAppearance() {
    openAppearanceSheet({
      preferences: state.preferences,
      onChange: async (key, value) => {
        state.preferences = await setPreference(key, value);
        applyTheme(state.preferences.themeMode);
        state.editorView?.updateAppearance(state.preferences);
        return { ...state.preferences };
      },
      onChangePassword
    });
  }

  function openKeyboardShortcuts() {
    openShortcutSheet({
      shortcuts: state.preferences.keyboardShortcuts,
      onChange: async (action, shortcut) => {
        const next = { ...state.preferences.keyboardShortcuts, [action]: shortcut };
        state.preferences = await setPreference('keyboardShortcuts', next);
        state.preferences.keyboardShortcuts = { ...DEFAULT_SHORTCUTS, ...(state.preferences.keyboardShortcuts || {}) };
        return { ...state.preferences.keyboardShortcuts };
      },
      onRestore: async () => {
        state.preferences = await setPreference('keyboardShortcuts', { ...DEFAULT_SHORTCUTS });
        return { ...state.preferences.keyboardShortcuts };
      }
    });
  }

  async function shareCurrent() {
    const text = state.currentContent;
    if (!text.trim()) return;
    await flushSave();
    try {
      const payload = buildSharePayload(text, state.currentSnippet?.sourceUrl);
      const result = await shareText(payload, toPlainText(text));
      if (result === 'copied') showToast('Copied');
    } catch (error) {
      console.error(error);
      showToast('Could not share');
    }
  }

  async function openEditorMore() {
    if (state.currentContent.trim()) await flushSave();
    const secondaryActions = standardMoreActions({ includeSignOut: Boolean(onSignOut) });
    const actions = state.currentContent.trim() ? [
      { id: 'pin', label: state.currentSnippet?.pinned ? 'Unpin' : 'Pin' },
      { id: 'archive', label: state.currentSnippet?.archived ? 'Unarchive' : 'Archive' },
      { id: 'copy', label: 'Copy' },
      { id: 'copy-markdown', label: 'Copy Markdown' },
      { id: 'delete', label: 'Delete', danger: true },
      ...secondaryActions
    ] : secondaryActions;

    openMoreMenu({
      actions,
      onAction: async id => {
        if (id === 'shortcuts') { openKeyboardShortcuts(); return; }
        if (id === 'select') { await enterSelectionMode(state.currentSnippet?.id || null); return; }
        if (id === 'trash') { await showTrash(); return; }
        if (id === 'web-capture') { openWebCaptureSheet(); return; }
        if (id === 'signout') { await onSignOut?.(); return; }
        await flushSave();
        if (!state.currentSnippet) return;
        if (id === 'pin') {
          await togglePin();
        } else if (id === 'archive') {
          await toggleArchive();
        } else if (id === 'copy') {
          await copyText(toPlainText(state.currentContent));
          showToast('Copied');
        } else if (id === 'copy-markdown') {
          await copyText(state.currentContent);
          showToast('Markdown copied');
        } else if (id === 'delete') {
          await moveToTrash(state.currentSnippet.id);
          state.currentSnippet = null;
          state.currentContent = '';
          if (isDesktop()) await showEditor(null);
          else await showLibrary('inbox');
        }
      }
    });
  }

  function openLibraryMore() {
    const actions = standardMoreActions({ includeSignOut: Boolean(onSignOut) });
    openMoreMenu({
      actions,
      onAction: async id => {
        if (id === 'select') await enterSelectionMode();
        else if (id === 'trash') await showTrash();
        else if (id === 'web-capture') openWebCaptureSheet();
        else if (id === 'shortcuts') openKeyboardShortcuts();
        else if (id === 'signout') await onSignOut?.();
      }
    });
  }

  async function batchRestoreFromTrash() {
    const items = await selectedSnippets();
    if (!items.length) return;
    for (const item of items) await restoreSnippet(item.id);
    await refreshAfterBatchMutation();
    showToast(items.length === 1 ? 'Restored' : `${items.length} restored`);
  }

  async function batchDeleteFromTrash() {
    const items = await selectedSnippets();
    if (!items.length) return;
    const message = items.length === 1
      ? 'Delete this snippet permanently? This cannot be undone.'
      : `Delete ${items.length} snippets permanently? This cannot be undone.`;
    if (!window.confirm(message)) return;
    for (const item of items) await deleteSnippetPermanently(item.id);
    await refreshAfterBatchMutation();
  }

  async function deleteAllTrash() {
    const items = await listSnippets({ scope: 'trash' });
    if (!items.length) return;
    const noun = items.length === 1 ? 'snippet' : 'snippets';
    if (!window.confirm(`Delete all ${items.length} ${noun} permanently? This cannot be undone.`)) return;
    for (const item of items) await deleteSnippetPermanently(item.id);
    resetSelectionState();
    await renderTrash();
    showToast('Trash emptied');
  }

  async function leaveTrash() {
    const destination = state.trashReturn;
    state.trashReturn = null;
    resetSelectionState();
    if (destination?.screen === 'editor') {
      await showEditor(destination.id || null);
      return;
    }
    await showLibrary(destination?.scope || 'inbox');
  }

  async function renderTrash() {
    const items = (await listSnippets({ scope: 'trash' })).sort((a, b) => (b.deletedAt || 0) - (a.deletedAt || 0));
    renderTrashView(root, {
      items,
      selectionMode: state.selectionMode,
      selectedIds: state.selectedIds,
      onBack: () => leaveTrash(),
      onRestore: async id => { await restoreSnippet(id); await renderTrash(); showToast('Restored'); },
      onDeleteAll: () => deleteAllTrash(),
      onDeletePermanently: async id => {
        if (!window.confirm('Delete this snippet permanently? This cannot be undone.')) return;
        await deleteSnippetPermanently(id);
        await renderTrash();
      },
      onSelect: () => enterSelectionMode(),
      onStartSelection: id => enterSelectionMode(id),
      onToggleSelection: id => toggleSelection(id),
      onRangeSelect: id => rangeSelect(id),
      onDoneSelection: () => finishSelection(),
      onBatchRestore: () => batchRestoreFromTrash(),
      onBatchDelete: () => batchDeleteFromTrash()
    });
  }

  async function showTrash() {
    if (state.screen !== 'trash') {
      state.trashReturn = {
        screen: state.screen,
        scope: state.libraryScope,
        id: state.currentSnippet?.id || null
      };
      if (state.screen === 'editor') await leaveEditor();
      resetSelectionState();
      state.screen = 'trash';
    }
    await renderTrash();
  }

  async function handleGlobalShortcut(event) {
    if (document.body.dataset.shortcutCapture === 'true') return;
    if (state.selectionMode && event.key === 'Escape') { event.preventDefault(); await finishSelection(); return; }
    const shortcuts = state.preferences.keyboardShortcuts || DEFAULT_SHORTCUTS;
    const action = Object.entries(shortcuts).find(([, shortcut]) => shortcutMatchesEvent(shortcut, event))?.[0];
    if (!action) return;
    event.preventDefault();

    if (action === 'newSnippet') await showEditor(null);
    else if (action === 'inbox') await switchLibraryScope('inbox');
    else if (action === 'starred') await switchLibraryScope('starred');
    else if (action === 'archive') await switchLibraryScope('archive');
    else if (action === 'toggleStar' && state.selectionMode) await batchToggleStar();
    else if (action === 'toggleStar' && state.screen === 'editor') await toggleStar();
    else if (action === 'tags') {
      if (state.selectionMode && state.screen !== 'trash') await openBatchTags();
      else if (state.screen === 'editor') await openEditorTags();
      else if (state.screen === 'library') await openLibraryTags();
    } else if (action === 'toggleSidebar') await toggleSidebar();
  }

  document.addEventListener('keydown', handleGlobalShortcut);

  const initialSnippets = await listSnippets({ scope: 'all' });
  const target = chooseLaunchTarget({
    snippets: initialSnippets,
    returnWindow: state.preferences.returnWindow,
    captureFirst: !isDesktop()
  });
  if (target.type === 'snippet') await showEditor(target.id);
  else if (target.type === 'inbox') await showLibrary('inbox');
  else await showEditor(null);

  const flushOnHide = () => {
    if (state.screen === 'editor') flushSave();
  };
  window.addEventListener('pagehide', flushOnHide);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushOnHide(); });

  return {
    openSnippet(id) { return showEditor(id); },
    newSnippet() { return showEditor(null); },
    destroy() {
      clearTimeout(state.saveTimer);
      state.editorView?.destroy();
      systemTheme.removeEventListener?.('change', systemThemeHandler);
      window.removeEventListener('pagehide', flushOnHide);
      document.removeEventListener('keydown', handleGlobalShortcut);
      root.replaceChildren();
    }
  };
}


// ---- src/main.js ----
const root = document.querySelector('#app');
let appInstance = null;
let stopCloudSync = null;
let currentUserId = null;
let openingUserId = null;
let captureConsumed = false;
let pendingCapture = parseCaptureUrl(window.location.href);
let authNotice = '';
const captureSession = new URL(window.location.href).searchParams.get('captureSession');

function appBaseUrl() {
  const url = clearCaptureParameters(window.location.href);
  url.hash = '';
  return url.href;
}

function cleanAddressBar() {
  const clean = clearCaptureParameters(window.location.href);
  if (clean.href !== window.location.href) history.replaceState(null, '', clean.href);
}

async function consumeCapture() {
  if (captureConsumed || !pendingCapture || !appInstance || !currentUserId) return;
  captureConsumed = true;
  const capture = pendingCapture;
  pendingCapture = null;
  const snippet = await createSnippet(capture.markdown, Date.now(), { sourceUrl: capture.sourceUrl });
  cleanAddressBar();
  await appInstance.openSnippet(snippet.id);
}

window.addEventListener('message', event => {
  if (!isCaptureMessage(event.data, captureSession) || captureConsumed) return;
  const capture = captureToSnippet(event.data);
  if (!capture) return;
  pendingCapture = capture;
  consumeCapture().catch(console.error);
});

async function cleanupAuthenticatedApp() {
  stopCloudSync?.();
  stopCloudSync = null;
  appInstance?.destroy?.();
  appInstance = null;
  currentUserId = null;
}

function showAuth(message = authNotice) {
  authNotice = '';
  renderAuthView(root, {
    initialError: message,
    onPasswordSignIn: async (email, password) => {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
      if (data.session) await openAuthenticated(data.session);
    },
    onRequestLink: async email => {
      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: appBaseUrl(), shouldCreateUser: false }
      });
      if (error) throw error;
    }
  });
}

async function openAuthenticated(session) {
  const user = session?.user;
  if (!user || currentUserId === user.id || openingUserId === user.id) return;
  openingUserId = user.id;
  try {
    const { data: hasAccess, error: accessError } = await supabase.rpc('snippets_has_access');
    if (accessError) throw accessError;
    if (!hasAccess) {
      authNotice = 'This account is not authorized for Snippets.';
      const { error: signOutError } = await supabase.auth.signOut();
      if (signOutError) throw signOutError;
      return;
    }
    await cleanupAuthenticatedApp();
    const cache = await prepareCacheForUser(user.id);
    try {
      await initialCloudSync(supabase, user.id, { adoptExistingCache: cache.adoptedExistingCache });
    } catch (error) {
      console.warn('Snippets cloud sync unavailable; using local cache.', error);
    }
    appInstance = await createApp(root, {
      onSignOut: async () => {
        const { error } = await supabase.auth.signOut();
        if (error) throw error;
      },
      onChangePassword: async password => {
        const { error } = await supabase.auth.updateUser({ password });
        if (error) throw error;
      }
    });
    currentUserId = user.id;
    stopCloudSync = startCloudSync(supabase, user.id);
    await consumeCapture();
  } finally {
    openingUserId = null;
  }
}

async function boot() {
  const { data, error } = await supabase.auth.getSession();
  if (error) throw error;
  if (data.session) await openAuthenticated(data.session);
  else showAuth();

  supabase.auth.onAuthStateChange((event, session) => {
    queueMicrotask(async () => {
      if (event === 'SIGNED_OUT' || !session) {
        await cleanupAuthenticatedApp();
        showAuth();
      } else if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION' || event === 'TOKEN_REFRESHED') {
        await openAuthenticated(session);
      }
    });
  });
}

boot().catch(error => {
  console.error(error);
  root.innerHTML = '<main class="library-empty" style="padding:20vh 24px">Could not open Snippets.</main>';
});
